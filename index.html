:root{--blue:#123f80;--bg:#eaf1fa;--red:#b50018}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17283c;font-size:22px;line-height:1.6}.shell{max-width:920px;margin:auto;padding:20px 16px 140px}.top{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--blue);font-weight:700}.student{font-size:16px;margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{background:white;border-radius:20px;padding:28px;box-shadow:0 8px 28px #14375e12;border-top:6px solid var(--blue)}h1{font-size:clamp(28px,6vw,46px);line-height:1.2}h2{font-size:30px;line-height:1.25}p{margin:0 0 22px}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;background:var(--blue);color:white;padding:13px 18px;font-weight:bold}button:disabled{opacity:.35;cursor:default}button.secondary{background:#dce8f7;color:var(--blue)}input{width:100%;padding:16px;border:2px solid #8ba5c5;border-radius:12px;margin:12px 0}label{font-weight:bold}small,.note{font-size:16px}.cover{text-align:center}.cover .fgv{font-size:34px;font-weight:900;color:var(--blue);margin:12px}.brand{font-size:25px;font-weight:800;line-height:1.4;margin:25px 0}.contact{font-size:21px;color:var(--blue)}.gate{text-align:left;background:#edf4ff;padding:22px;border-radius:15px;margin-top:30px}.gate button{width:100%}.option{border:1px solid #cbd8e9;border-radius:12px;padding:16px;background:#f7faff}.answer{color:var(--blue)}.answer-title{background:#e8f1ff;padding:16px;border-radius:12px;font-size:26px;font-weight:bold;line-height:1.4}.subjudice{color:var(--red)!important;border-color:var(--red)!important}.subjudice *{color:var(--red)!important}.badge{display:inline-block;border:2px solid currentColor;padding:5px 14px;border-radius:9px;font-weight:900;letter-spacing:.1em;margin-bottom:14px}.subjudice .option,.subjudice .answer-title{background:#fff2f3;border-color:#eaa6af}.nav{position:fixed;bottom:0;left:0;right:0;padding:12px 14px max(12px,env(safe-area-inset-bottom));background:#ffffffed;border-top:1px solid #cad8ea;backdrop-filter:blur(10px);z-index:10}.nav-inner{max-width:920px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.progress{max-width:920px;margin:0 auto 9px;font-size:15px;text-align:center}.bar{height:5px;background:#d8e4f3;max-width:920px;margin:0 auto 10px;border-radius:5px;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue)}.table-scroll{overflow-x:auto;margin:20px 0}table{border-collapse:collapse;width:100%;font-size:18px}th,td{padding:12px;border:1px solid #cad8ea;text-align:left}th{background:#e8f1ff;color:var(--blue)}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.tools label{font-size:15px}.tools select{font-size:17px;padding:8px;max-width:100%;border:1px solid #8ba5c5;border-radius:8px}.error{color:#b50018;font-size:16px}.status{font-size:14px;margin:10px 0;color:#52647b}dialog{max-width:480px;width:90%;border:0;border-radius:20px;padding:28px}dialog::backdrop{background:#001c3c88}dialog h2{font-size:26px}.dialog-actions{display:flex;gap:12px;flex-wrap:wrap}a{color:var(--blue)}@media(max-width:480px){.shell{padding:12px 10px 150px}.card{padding:20px 16px}body{font-size:21px}.nav button{font-size:17px;padding:14px 4px}.brand{font-size:23px}h2{font-size:28px}}@media print{.nav,.tools,.student{display:none}.shell{padding:0}.card{box-shadow:none}}

:root{--text-size:28px}body{font-size:var(--text-size);line-height:1.65}.card{padding:30px}.card p{overflow-wrap:anywhere}h2{font-size:36px}.answer-title{font-size:30px}table{font-size:var(--text-size)}.size-control{display:flex;gap:8px;align-items:center}.size-control button{font-size:17px;padding:9px 12px}.answer-part{font-size:21px;font-weight:bold;color:var(--blue);margin-bottom:22px}.nav button{font-size:20px}.note{font-size:19px}.table-scroll{overflow:visible}th,td{overflow-wrap:anywhere}.card a{text-decoration:underline}.subjudice a{color:var(--red)}.resume-choices{display:flex;gap:12px;flex-wrap:wrap}.resume-choices button{width:auto}.gate{font-size:24px}.status{font-size:16px}@media(max-width:650px){body{font-size:var(--text-size)}.card{padding:24px 17px}h2{font-size:32px}table,tbody,tr,td{display:block;width:100%}thead{display:none}tr{margin-bottom:20px;border:2px solid #cad8ea;border-radius:12px;overflow:hidden}td{border:0;border-bottom:1px solid #cad8ea;padding:14px}td:last-child{border-bottom:0}td::before{content:attr(data-label);display:block;font-weight:bold;color:var(--blue);font-size:21px;margin-bottom:5px}.subjudice td::before{color:var(--red)}.nav button{font-size:18px}.shell{padding-bottom:160px}.table-scroll{overflow:visible}.brand{font-size:26px}.contact{font-size:24px}}
</style></head><body><main class="shell"><div class="top">Curso de Contabilidade Professor Moreira</div><div id="identity" class="student"></div><div id="tools" class="tools" hidden><label for="jump">Ir à questão</label><select id="jump" aria-label="Ir à questão"></select><div class="size-control"><button id="smaller" class="secondary" aria-label="Diminuir letras">A−</button><button id="larger" class="secondary" aria-label="Aumentar letras">A+</button></div></div><div id="storageStatus" class="status" role="status"></div><article id="screen" class="card" aria-live="polite"></article></main><footer id="nav" class="nav" hidden><div id="progress" class="progress"></div><div class="bar"><span id="bar"></span></div><div class="nav-inner"><button id="prev" aria-label="Voltar à tela anterior">← Voltar</button><button id="restart" class="secondary">↺ Reiniciar</button><button id="next" aria-label="Avançar à próxima tela">Ir →</button></div></footer><dialog id="resetDialog"><h2>Reiniciar a prova?</h2><p>Você voltará à questão 1. Seu nome será mantido.</p><div class="dialog-actions"><button id="resetYes">Reiniciar</button><button id="resetNo" class="secondary">Cancelar</button></div></dialog><dialog id="switchDialog"><h2>Trocar aluno?</h2><p>O nome e o ponto de retomada deste aluno serão apagados neste navegador. O próximo aluno começará na questão 1.</p><div class="dialog-actions"><button id="switchYes">Trocar aluno</button><button id="switchNo" class="secondary">Cancelar</button></div></dialog><script>
const PAGES=[{"n": 1, "kind": "question", "html": "<p>Nas frases abaixo foram feitas substituições, mantendo-se o mesmo sentido original. Assinale a opção em que a modificação não está adequada por alterar esse sentido original.<\/p><p class=\"option\">(A) A música é a alma da geometria /A música é a essência da geometria.<\/p><p class=\"option\">(B) Somente por meio do amor o homem pode ser liberado de si mesmo / Por meio do amor somente o homem pode ser liberado de si mesmo.<\/p><p class=\"option\">(C) O amor é a capacidade de perceber o semelhante no dessemelhante / O amor é a capacidade de percepção do semelhante no dessemelhante.<\/p><p class=\"option\">(D) Todas as paixões nos fazem cometer erros / Todas as paixões fazem que cometamos erros.<\/p>"}, {"n": 1, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: B.<\/strong><\/p><p>A mudança da posição de <strong>“somente”<\/strong> altera aquilo que está sendo restringido.<\/p><p>Na primeira frase:<br><strong>“Somente por meio do amor o homem pode ser liberado de si mesmo.”<\/strong><br>O amor é apresentado como o <strong>único meio<\/strong> de libertação.<\/p><p>Na segunda:<br><strong>“Por meio do amor somente o homem pode ser liberado de si mesmo.”<\/strong><br>A restrição passa a recair sobre <strong>o homem<\/strong>, indicando que apenas ele pode ser libertado por esse meio.<\/p><p>Nas demais alternativas, as substituições preservam o sentido no contexto.<\/p>"}, {"n": 2, "kind": "question", "html": "<p>Assinale a única frase abaixo que se mostra gramaticalmente correta.<\/p><p class=\"option\">(A) A polícia interviu na briga entre as torcidas, após o jogo.<\/p><p class=\"option\">(B) Compras à crédito podem trazer problemas futuros.<\/p><p class=\"option\">(C) Haviam muitos carros abandonados ne estrada por causa dos desabamentos.<\/p><p class=\"option\">(D) Para mim, trabalhar é uma atividade prazerosa.<\/p>"}, {"n": 2, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: D.<\/strong><\/p><p>Em <strong>“Para mim, trabalhar é uma atividade prazerosa”<\/strong>, a expressão “para mim” indica opinião: <strong>na minha opinião<\/strong>.<\/p><p>O pronome “mim” não é o sujeito de “trabalhar”. O trecho “trabalhar” funciona como sujeito de “é uma atividade prazerosa”.<\/p><p><strong>Correção das alternativas erradas<\/strong><\/p><p><strong>A:<\/strong> o passado de “intervir” segue a conjugação de “vir”: <strong>“A polícia interveio...”<\/strong><\/p><p><strong>B:<\/strong> não há crase antes da palavra masculina “crédito”: <strong>“Compras a crédito...”<\/strong><\/p><p><strong>C:<\/strong> “haver”, no sentido de existir, é impessoal e permanece no singular: <strong>“Havia muitos carros...”<\/strong> O original também apresenta “ne estrada”, em lugar de “na estrada”.<\/p>"}, {"n": 3, "kind": "question", "html": "<p>Um empréstimo no valor de R$ 500.000,00 será quitado segundo o Sistema de Amortização Constante (SAC). O contrato estabelece um prazo de 40 meses para a quitação, com parcelas mensais, postecipadas e juros fixos de 2% ao mês, incidentes sobre o saldo devedor remanescente do período imediatamente anterior. Sabe-se que uma das parcelas mensais terá valor de R$ 18.250,00. Desconsiderando-se quaisquer encargos adicionais, tais como IOF, seguros, moras e taxas, é correto concluir que esse é o valor do<\/p><p class=\"option\">(A) 17º pagamento.<\/p><p class=\"option\">(B) 18º pagamento.<\/p><p class=\"option\">(C) 19º pagamento.<\/p><p class=\"option\">(D) 20º pagamento.<\/p>"}, {"n": 3, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: B — 18º pagamento.<\/strong><\/p><p><strong>1º passo: calcular a amortização mensal<\/strong><br>No SAC, a amortização é constante:<br><strong>A = 500.000 ÷ 40 = R$ 12.500,00.<\/strong><\/p><p><strong>2º passo: calcular os juros da parcela indicada<\/strong><br>Prestação = Amortização + Juros.<br><strong>J = 18.250 − 12.500 = R$ 5.750,00.<\/strong><\/p><p><strong>3º passo: descobrir o saldo devedor antes dessa parcela<\/strong><br><strong>SD = J ÷ i = 5.750 ÷ 0,02 = R$ 287.500,00.<\/strong><\/p><p><strong>4º passo: descobrir quantos pagamentos já foram realizados<\/strong><br>Valor já amortizado:<br><strong>500.000 − 287.500 = R$ 212.500,00.<\/strong><br>Quantidade de amortizações realizadas:<br><strong>212.500 ÷ 12.500 = 17.<\/strong><\/p>"}, {"n": 3, "kind": "answer", "part": 2, "parts": 2, "html": "<p><strong>5º passo: identificar a parcela procurada<\/strong><br>Se <strong>17 pagamentos já ocorreram<\/strong>, a prestação procurada é a seguinte:<br><strong>17 + 1 = 18º pagamento.<\/strong><\/p>"}, {"n": 4, "kind": "question", "html": "<p>Ao encerrar o exercício social, o contador de uma empresa identificou um excedente temporário de caixa no valor de R$ 25.000,00. A diretoria autorizou a aplicação desse valor em um investimento financeiro remunerado à taxa de 8% ao ano, sob o regime de juros compostos. Se o recurso permanecer aplicado por 2 anos, sem aportes ou resgates intermediários, o montante acumulado ao final do período de aplicação será de:<\/p><p class=\"option\">(A) R$ 26.000,00.<\/p><p class=\"option\">(B) R$ 27.000,00.<\/p><p class=\"option\">(C) R$ 28.160,00.<\/p><p class=\"option\">(D) R$ 29.160,00.<\/p>"}, {"n": 4, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: D — R$ 29.160,00.<\/strong><\/p><p>Fórmula dos juros compostos:<br><strong>M = C × (1 + i)ⁿ.<\/strong><\/p><p>Substituindo:<br>M = 25.000 × (1 + 0,08)².<br>M = 25.000 × 1,1664.<br><strong>M = R$ 29.160,00.<\/strong><\/p><p><strong>Conferindo ano a ano<\/strong><\/p><div class=\"table-scroll\"><table><thead><tr><th>Período<\/th><th>Saldo inicial<\/th><th>Juros de 8%<\/th><th>Saldo final<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Período\">1º ano<\/td><td data-label=\"Saldo inicial\">R$ 25.000,00<\/td><td data-label=\"Juros de 8%\">R$ 2.000,00<\/td><td data-label=\"Saldo final\">R$ 27.000,00<\/td><\/tr><tr><td data-label=\"Período\">2º ano<\/td><td data-label=\"Saldo inicial\">R$ 27.000,00<\/td><td data-label=\"Juros de 8%\">R$ 2.160,00<\/td><td data-label=\"Saldo final\">R$ 29.160,00<\/td><\/tr><\/tbody><\/table><\/div><p>No segundo ano, os juros incidem sobre o capital acrescido dos juros do primeiro ano.<\/p>"}, {"n": 5, "kind": "question", "html": "<p>Em observância às formalidades constitucionais e legais aplicáveis à espécie, a autarquia Alfa publicou edital de licitação visando à celebração de futuro contrato administrativo. Busca-se, assim, a prestação de serviços públicos de forma descentralizada e especializada, em atendimento ao interesse público primário. Nesse cenário, considerando as disposições da Constituição Federal e o entendimento doutrinário dominante, é correto afirmar que a autarquia Alfa, por se tratar de uma pessoa jurídica de direito<\/p><p class=\"option\">(A) privado integrante da Administração Direta, teve a sua criação autorizada por lei específica.<\/p><p class=\"option\">(B) público integrante da Administração Direta, teve a sua criação autorizada por lei específica.<\/p><p class=\"option\">(C) público integrante da Administração Indireta, foi criada por lei específica.<\/p><p class=\"option\">(D) privado integrante da Administração Indireta, foi criada por lei específica.<\/p>"}, {"n": 5, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: C.<\/strong><\/p><p>A autarquia possui três características fundamentais:<br>• personalidade jurídica de <strong>direito público<\/strong>;<br>• integra a <strong>Administração Indireta<\/strong>;<br>• é <strong>criada por lei específica<\/strong>, conforme o art. 37, XIX, da Constituição Federal.<\/p><p><strong>Analisando as alternativas<\/strong><\/p><div class=\"table-scroll\"><table><thead><tr><th>Alternativa<\/th><th>Erro ou conclusão<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Alternativa\">A<\/td><td data-label=\"Erro ou conclusão\">Autarquia não é de direito privado nem integra a Administração Direta; a lei a cria<\/td><\/tr><tr><td data-label=\"Alternativa\">B<\/td><td data-label=\"Erro ou conclusão\">Embora seja de direito público, integra a Administração Indireta e é criada pela lei<\/td><\/tr><tr><td data-label=\"Alternativa\">C<\/td><td data-label=\"Erro ou conclusão\">Apresenta corretamente as três características<\/td><\/tr><tr><td data-label=\"Alternativa\">D<\/td><td data-label=\"Erro ou conclusão\">Autarquia tem personalidade de direito público<\/td><\/tr><\/tbody><\/table><\/div>"}, {"n": 5, "kind": "answer", "part": 2, "parts": 2, "html": "<p><strong>Para memorizar: autarquia = direito público + Administração Indireta + criação por lei específica.<\/strong><\/p>"}, {"n": 6, "kind": "question", "html": "<p>Após a observância do contraditório e da ampla defesa, como consectários do devido processo legal, a autoridade pública competente, no âmbito da autarquia Alfa, editou ato administrativo punitivo em detrimento de Lucas, servidor público estatutário, a ele aplicando a sanção administrativa de suspensão, em razão de infração funcional outrora praticada. Nesse cenário, considerando o entendimento doutrinário dominante, é correto afirmar que a infração funcional praticada por Lucas é<\/p><p class=\"option\">(A) a finalidade do ato administrativo punitivo.<\/p><p class=\"option\">(B) o motivo do ato administrativo punitivo.<\/p><p class=\"option\">(C) o objeto do ato administrativo punitivo.<\/p><p class=\"option\">(D) o móvel do ato administrativo punitivo.<\/p>"}, {"n": 6, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: B — motivo.<\/strong><\/p><p>O <strong>motivo<\/strong> corresponde ao pressuposto de fato e de direito que fundamenta a prática do ato.<\/p><p>A infração funcional é o <strong>fato que justificou a suspensão<\/strong>.<\/p><div class=\"table-scroll\"><table><thead><tr><th>Conceito<\/th><th>Aplicação à questão<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Conceito\">Motivo<\/td><td data-label=\"Aplicação à questão\">A infração funcional praticada por Lucas<\/td><\/tr><tr><td data-label=\"Conceito\">Objeto<\/td><td data-label=\"Aplicação à questão\">A sanção de suspensão aplicada<\/td><\/tr><tr><td data-label=\"Conceito\">Finalidade<\/td><td data-label=\"Aplicação à questão\">Atender ao interesse público, preservando a disciplina funcional<\/td><\/tr><tr><td data-label=\"Conceito\">Móvel<\/td><td data-label=\"Aplicação à questão\">A intenção subjetiva do agente que pratica o ato<\/td><\/tr><\/tbody><\/table><\/div><p><strong>A infração é o motivo; a suspensão é o objeto.<\/strong><\/p>"}, {"n": 7, "kind": "question", "html": "<p>Ao analisar o teor da Constituição Federal, João, estudante, constatou que determinado princípio foi nela incluído por meio da Emenda Constitucional nº 19/1998, com o objetivo de substituir a Administração Pública burocrática pela Administração Pública gerencial. A ideia por trás desse princípio está intimamente relacionada com a necessidade de efetivação célere das finalidades públicas elencadas no ordenamento jurídico. Nesse cenário, considerando as disposições da Constituição Federal e o entendimento doutrinário dominante, é correto afirmar que se está fazendo referência ao princípio da<\/p><p class=\"option\">(A) impessoalidade.<\/p><p class=\"option\">(B) moralidade.<\/p><p class=\"option\">(C) legalidade.<\/p><p class=\"option\">(D) eficiência.<\/p>"}, {"n": 7, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: D — eficiência.<\/strong><\/p><p>A Emenda Constitucional nº 19/1998 incluiu expressamente a <strong>eficiência<\/strong> entre os princípios do art. 37 da Constituição Federal.<\/p><p>Esse princípio exige atuação administrativa com qualidade, rapidez, bom uso dos recursos e resultados satisfatórios para a sociedade.<\/p><p>As expressões <strong>“Administração Pública gerencial”<\/strong> e <strong>“efetivação célere”<\/strong> apontam para a eficiência.<\/p><p>Os demais princípios se relacionam a:<br>• <strong>impessoalidade:<\/strong> atuação sem favorecimentos ou perseguições;<br>• <strong>moralidade:<\/strong> observância da ética e da probidade;<br>• <strong>legalidade:<\/strong> atuação conforme o ordenamento jurídico.<\/p>"}, {"n": 8, "kind": "question", "html": "<p>A empresa Horizonte Ltda. enfrenta dificuldades financeiras e seus gestores solicitam ao contador que elabore relatórios financeiros para fins gerais “menos detalhados” para evitar questionamentos de credores e investidores. Considerando o papel da Contabilidade na sociedade e as disposições da NBC PG 01 – CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR e da NBC PG 100 (R1) – CUMPRIMENTO DO CÓDIGO, DOS PRINCÍPIOS FUNDAMENTAIS E DA ESTRUTURA CONCEITUAL, a atuação adequada do profissional deve refletir o princípio de que a Contabilidade<\/p><p class=\"option\">(A) serve exclusivamente como instrumento interno de controle gerencial.<\/p><p class=\"option\">(B) atende prioritariamente aos interesses dos administradores da entidade, o que gera a necessidade de se balancear função social com interesses financeiros.<\/p><p class=\"option\">(C) deve adaptar o nível de transparência das informações à conveniência da administração.<\/p><p class=\"option\">(D) tem a função social de produzir informações úteis, fidedignas e transparentes para os diversos usuários, preservando o interesse público e a confiança na profissão contábil.<\/p>"}, {"n": 8, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: D.<\/strong><\/p><p>O contador deve produzir informações que representem adequadamente a situação da empresa e sejam úteis aos usuários.<\/p><p>A solicitação de reduzir detalhes <strong>para evitar questionamentos<\/strong> indica a intenção de ocultar informações relevantes. O profissional não deve aceitar essa interferência.<\/p><p>As dificuldades financeiras devem ser apresentadas adequadamente, com observância das normas contábeis e dos princípios éticos.<\/p><p><strong>Por que as outras estão erradas?<\/strong><\/p><p><strong>A:<\/strong> a Contabilidade também atende usuários externos.<\/p><p><strong>B:<\/strong> os interesses dos administradores não prevalecem sobre os deveres profissionais.<\/p>"}, {"n": 8, "kind": "answer", "part": 2, "parts": 2, "html": "<p><strong>C:<\/strong> a transparência não pode ser ajustada à conveniência da administração.<\/p>"}, {"n": 9, "kind": "question", "html": "<p>Durante procedimento de fiscalização do CRC, verificou-se que um contador responsável técnico delegava integralmente a execução de serviços contábeis a terceiros não registrados, assinando posteriormente as demonstrações sem revisão técnica adequada. O contador alegava que a responsabilidade era apenas contratual perante o cliente. Considerando a Resolução CFC nº 1.612/2021 – REGULAMENTO GERAL DOS CONSELHOS DE CONTABILIDADE, a NBC PG 01 – CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR e a NBC PG 100 (R1) – CUMPRIMENTO DO CÓDIGO, PRINCÍPIOS FUNDAMENTAIS E DA ESTRUTURA CONCEITUAL, a conduta profissional adequada reconhece que a responsabilidade técnica é<\/p><p class=\"option\">(A) pessoal e indelegável, limitada ao vínculo contratual firmado com o cliente, exigindo supervisão efetiva, observância das normas profissionais e cooperação com a fiscalização para preservar o interesse público.<\/p><p class=\"option\">(B) pessoal e delegável, exigindo supervisão seletiva, observância das normas profissionais e alinhamento automático com a fiscalização na preservação dos interesses particulares.<\/p><p class=\"option\">(C) impessoal e delegável, exigindo supervisão seletiva, inobservância das normas profissionais e embate com a fiscalização a respeito do interesse público.<\/p><p class=\"option\">(D) pessoal e indelegável, exigindo supervisão efetiva, observância das normas profissionais e cooperação com a fiscalização para preservar o interesse público.<\/p>"}, {"n": 9, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: D.<\/strong><\/p><p>O contador responsável técnico não transfere sua responsabilidade simplesmente porque outra pessoa executou o trabalho.<\/p><p>Ele deve orientar, supervisionar e revisar adequadamente os serviços. O Código de Ética veda assinar peças contábeis elaboradas por terceiros alheios à sua orientação, supervisão ou revisão.<\/p><p><strong>Atenção à alternativa A:<\/strong> ela se parece com a correta, mas inclui a expressão <strong>“limitada ao vínculo contratual firmado com o cliente”<\/strong>.<\/p><p>A responsabilidade profissional também envolve deveres perante os órgãos fiscalizadores e a sociedade.<\/p><p><strong>B:<\/strong> erra ao afirmar que a responsabilidade técnica é delegável.<\/p>"}, {"n": 9, "kind": "answer", "part": 2, "parts": 2, "html": "<p><strong>C:<\/strong> erra ao qualificá-la como impessoal e delegável, além de defender a inobservância das normas.<\/p><p><strong>D:<\/strong> reúne corretamente responsabilidade pessoal, supervisão efetiva e observância das normas.<\/p>"}, {"n": 10, "kind": "question", "html": "<p>O contador Marcos atua como Perito Contábil inscrito no CNPC. Em um ano-calendário, cumpriu 35 pontos de Educação Profissional Continuada (EPC), sendo 10 na diretriz de aquisição de conhecimento. Acreditando estar regular, inseriu seus comprovantes no sistema Web EPC do Conselho Federal de Contabilidade, no dia 20 de fevereiro do exercício subsequente. Nesse caso, com base na NBC PG 12 (R5) – EDUCAÇÃO PROFISSIONAL CONTINUADA, avalie se cada afirmativa a seguir é verdadeira (V) ou falsa (F).<\/p><p>( ) A submissão à Educação Profissional Continuada é facultativa para Marcos, pois a obrigatoriedade normativa restringe-se aos auditores independentes e responsáveis técnicos.<\/p><p>( ) A pontuação alcançada por Marcos foi insuficiente, uma vez que a norma exige, no mínimo, 40 pontos anuais, sendo obrigatoriamente 12 pontos em aquisição de conhecimento.<\/p><p>( ) O envio da comprovação documental no sistema Web EPC foi intempestivo, visto que o prazo máximo determinado pela regulamentação é até 31 de janeiro do exercício subsequente. As afirmativas são, respectivamente,<\/p><p class=\"option\">(A) F – V – V.<\/p><p class=\"option\">(B) V – F – F.<\/p><p class=\"option\">(C) F – F – V.<\/p><p class=\"option\">(D) V – V – F.<\/p>"}, {"n": 10, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: A — F – V – V.<\/strong><\/p><p><strong>Primeira afirmativa — Falsa.<\/strong><br>A obrigatoriedade da Educação Profissional Continuada também alcança os peritos inscritos no <strong>Cadastro Nacional de Peritos Contábeis — CNPC<\/strong>. Portanto, Marcos está sujeito ao programa.<\/p><p><strong>Segunda afirmativa — Verdadeira.<\/strong><br>A exigência é de, no mínimo, <strong>40 pontos anuais<\/strong>, dos quais pelo menos <strong>12 pontos em aquisição de conhecimento<\/strong>.<\/p><div class=\"table-scroll\"><table><thead><tr><th>Exigência<\/th><th>Mínimo<\/th><th>Marcos cumpriu<\/th><th>Situação<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Exigência\">Pontuação anual<\/td><td data-label=\"Mínimo\">40<\/td><td data-label=\"Marcos cumpriu\">35<\/td><td data-label=\"Situação\">Insuficiente<\/td><\/tr><tr><td data-label=\"Exigência\">Aquisição de conhecimento<\/td><td data-label=\"Mínimo\">12<\/td><td data-label=\"Marcos cumpriu\">10<\/td><td data-label=\"Situação\">Insuficiente<\/td><\/tr><\/tbody><\/table><\/div><p>Marcos ficou abaixo dos dois mínimos exigidos.<\/p>"}, {"n": 10, "kind": "answer", "part": 2, "parts": 2, "html": "<p><strong>Terceira afirmativa — Verdadeira.<\/strong><br>O prazo para apresentar a comprovação é <strong>31 de janeiro do exercício subsequente<\/strong>. A entrega em <strong>20 de fevereiro<\/strong> ocorreu fora do prazo.<\/p><p>Assim, a sequência é <strong>F – V – V<\/strong>.<br>Base: NBC PG 12 (R5).<\/p>"}, {"n": 11, "kind": "question", "html": "<p>Em março de 2026, uma sociedade empresária publicou as suas demonstrações contábeis referentes a 31/12/2025. De acordo com a NBC TG ESTRUTURA CONCEITUAL – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, as demonstrações contábeis são elaboradas para um período de tempo específico (período de relatório), para ajudar os usuários a identificar e avaliar mudanças e tendências e também<\/p><p class=\"option\">(A) calculam os principais indicadores de análise contábil.<\/p><p class=\"option\">(B) apresentam projeções para, pelo menos, o exercício seguinte.<\/p><p class=\"option\">(C) reproduzem as normas contábeis relacionadas a cada ponto apresentado.<\/p><p class=\"option\">(D) fornecem informações comparativas de, pelo menos, um período de relatório anterior.<\/p>"}, {"n": 11, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: D.<\/strong><\/p><p>A informação comparativa permite avaliar mudanças entre períodos. Assim, as demonstrações referentes a 2025 apresentam também informações de, pelo menos, um período anterior. Essa previsão consta do item 3.5 da Estrutura Conceitual.<\/p><p>As demais alternativas apresentam exigências que não correspondem à disposição solicitada: calcular indicadores, apresentar projeções ou reproduzir normas.<\/p>"}, {"n": 12, "kind": "question", "html": "<p>Com base nos conceitos de ativos, passivos, receitas e despesas e dos critérios necessários para reconhecimento apresentados na NBC TG ESTRUTURA CONCEITUAL, assinale a afirmativa correta.<\/p><p class=\"option\">(A) A receita deve ser reconhecida quando o cliente realiza o pedido para a realização de um determinado serviço, com contrapartida em Contas a Receber de Clientes.<\/p><p class=\"option\">(B) A distribuição de dividendos deve ser reconhecida como despesa financeira no resultado, em contrapartida ao passivo ou caixa.<\/p><p class=\"option\">(C) O aumento de capital gera o reconhecimento de receitas em contrapartida ao registro em caixa.<\/p><p class=\"option\">(D) O custo das mercadorias vendidas deve ser reconhecido quando ocorre a transferência de controle das mercadorias ao cliente, com a baixa dos estoques no ativo.<\/p>"}, {"n": 12, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: D.<\/strong><\/p><p>Quando o controle das mercadorias é transferido ao cliente, reconhece-se a venda e o custo correspondente, com a baixa do estoque:<\/p><p><strong>D — Custo das Mercadorias Vendidas<\/strong><br><strong>C — Estoques de Mercadorias<\/strong><\/p><p><strong>Analisando as incorretas<\/strong><\/p><p><strong>A:<\/strong> o simples pedido não representa serviço prestado.<\/p><p><strong>B:<\/strong> dividendos constituem distribuição aos proprietários, e não despesa financeira.<\/p><p><strong>C:<\/strong> integralização de capital constitui contribuição dos proprietários, e não receita.<\/p>"}, {"n": 13, "kind": "question", "html": "<p>Uma companhia S.A. realizou recentemente sua oferta pública inicial de ações (IPO) e passou a negociar seus papéis em Bolsa de Valores. Em uma reunião do conselho de administração, o diretor de relações com investidores destacou a importância do relatório financeiro para fins gerais, afirmando que ele deve atender às necessidades informacionais dos diversos usuários externos da companhia. Durante a reunião, foram apresentadas algumas afirmações sobre o objetivo do relatório financeiro para fins gerais. Considerando-se os preceitos da NBC TG ESTRUTURA CONCEITUAL, é correto afirmar que<\/p><p class=\"option\">(A) o relatório financeiro para fins gerais destina-se a apresentar o valor de mercado da entidade que reporta.<\/p><p class=\"option\">(B) a administração da companhia depende das informações do relatório financeiro para fins gerais para basear suas decisões estratégicas.<\/p><p class=\"option\">(C) o relatório financeiro para fins gerais fornece todas as informações de que necessitam investidores, credores por empréstimos e administradores da companhia para a tomada de decisões.<\/p><p class=\"option\">(D) o objetivo do relatório financeiro para fins gerais é fornecer informações úteis a investidores, credores por empréstimos e outros credores, existentes e potenciais, para decisões sobre o fornecimento de recursos à entidade.<\/p>"}, {"n": 13, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: D.<\/strong><\/p><p>O objetivo é fornecer informações úteis aos investidores e credores para decisões sobre o fornecimento de recursos à entidade.<\/p><p><strong>A:<\/strong> o relatório não se destina a apresentar diretamente o valor de mercado da entidade.<\/p><p><strong>B:<\/strong> a administração pode obter internamente as informações de que necessita.<\/p><p><strong>C:<\/strong> os relatórios não fornecem todas as informações necessárias às decisões; os usuários também consideram outras fontes.<\/p>"}, {"n": 14, "kind": "question", "html": "<p>Uma empresa S.A. tem como objeto a lavra, o processamento, o comércio e o transporte de petróleo proveniente de poço. Após o encerramento do exercício social de 2025, em 31/12/2025, e antes da data de autorização para emissão das demonstrações contábeis, uma plataforma de petróleo da empresa pegou fogo, gerando danos significativos ao ativo imobilizado. Considerando-se as informações apresentadas e os preceitos da NBC TG 24 (R2) – EVENTO SUBSEQUENTE, o incêndio<\/p><p class=\"option\">(A) deve ser desconsiderado como um evento subsequente, pois ocorreu fora do período contábil de 2025.<\/p><p class=\"option\">(B) deve ser desconsiderado nas demonstrações contábeis, pois ainda não houve baixa da plataforma incendiada.<\/p><p class=\"option\">(C) é um evento subsequente que representa condição surgida após a data-base, devendo ser divulgado em nota explicativa.<\/p><p class=\"option\">(D) é um evento subsequente que exige ajuste nas demonstrações contábeis, pois evidencia uma condição existente na data- base.<\/p>"}, {"n": 14, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: C.<\/strong><\/p><p>O incêndio ocorreu <strong>depois de 31/12/2025<\/strong>, mas antes da autorização para emissão das demonstrações.<\/p><p>Ele representa uma condição surgida após a data-base. Portanto:<br>• não ajusta os valores das demonstrações de 2025;<br>• exige divulgação em nota explicativa por ser significativo;<br>• a divulgação deve informar a natureza do evento e a estimativa de seu efeito financeiro, ou a impossibilidade de estimá-lo.<\/p><p>A alternativa D seria aplicável a um evento que fornecesse evidência de uma condição já existente em 31/12/2025.<br>Base: NBC TG 24.<\/p>"}, {"n": 15, "kind": "question", "html": "<p>A empresa Cargas ABC S.A. possui em seu Ativo Imobilizado um veículo utilizado para entregas. Ao final do exercício de 2025, a empresa realizou o teste de recuperabilidade (impairment) para esse Ativo. O contador da empresa levantou as seguintes informações:<\/p><p>• Valor Contábil (após depreciação): R$ 150.000,00.<\/p><p>• Valor Justo Líquido de despesas de venda: R$ 130.000,00.<\/p><p>• Valor em uso: R$ 145.000,00. Com base nas disposições da NBC TG 01 (R4) – REDUÇÃO AO VALOR RECUPERÁVEL DE ATIVOS, o procedimento correto a ser adotado pela empresa é<\/p><p class=\"option\">(A) reconhecer uma perda por desvalorização no valor de R$ 20.000,00, pois o valor de venda é o menor dentre os valores apresentados.<\/p><p class=\"option\">(B) não reconhecer nenhuma perda, pois o valor recuperável, de R$ 145.000,00, é maior do que o valor de venda.<\/p><p class=\"option\">(C) reconhecer uma perda por desvalorização no valor de R$ 5.000,00, para ajustar o valor contábil ao valor recuperável.<\/p><p class=\"option\">(D) ajustar o valor do ativo para R$ 130.000,00, em observância ao princípio da prudência.<\/p>"}, {"n": 15, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: C — R$ 5.000,00.<\/strong><\/p><p>O valor recuperável é o <strong>maior<\/strong> entre:<\/p><div class=\"table-scroll\"><table><thead><tr><th>Critério<\/th><th>Valor<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Critério\">Valor justo líquido de despesas de venda<\/td><td data-label=\"Valor\">R$ 130.000,00<\/td><\/tr><tr><td data-label=\"Critério\">Valor em uso<\/td><td data-label=\"Valor\">R$ 145.000,00<\/td><\/tr><tr><td data-label=\"Critério\">Valor recuperável<\/td><td data-label=\"Valor\">R$ 145.000,00<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Perda = Valor contábil − Valor recuperável.<\/strong><br>Perda = R$ 150.000,00 − R$ 145.000,00.<br><strong>Perda = R$ 5.000,00.<\/strong><\/p><p><strong>Lançamento<\/strong><br><strong>D — Perda por redução ao valor recuperável: R$ 5.000,00<\/strong><br><strong>C — Perda acumulada por redução ao valor recuperável: R$ 5.000,00<\/strong><\/p><p>O veículo passa a apresentar valor contábil líquido de R$ 145.000,00.<br>Base: NBC TG 01.<\/p>"}, {"n": 16, "kind": "question", "html": "<p>A Indústria Metalúrgica Aço S.A. adquiriu uma nova máquina para sua linha de produção. Durante o processo de aquisição e instalação, a empresa incorreu nos seguintes gastos:<\/p><p>• Preço de compra da máquina: R$ 200.000,00.<\/p><p>• Gastos com frete e seguro para transporte até a fábrica: R$ 10.000,00.<\/p><p>• Gastos com a preparação do local e fundação para instalação da máquina: R$ 15.000,00.<\/p><p>• Treinamento dos funcionários para operar a nova máquina: R$ 5.000,00.<\/p><p>• Gastos com testes para verificar se o equipamento está funcionando adequadamente: R$ 3.000,00. Com base nas disposições da NBC TG 27 (R4) – ATIVO IMOBILIZADO, o valor total que deve ser reconhecido inicialmente no Ativo da empresa referente a essa máquina é de<\/p><p class=\"option\">(A) R$ 228.000,00.<\/p><p class=\"option\">(B) R$ 233.000,00.<\/p><p class=\"option\">(C) R$ 200.000,00.<\/p><p class=\"option\">(D) R$ 210.000,00.<\/p>"}, {"n": 16, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: A — R$ 228.000,00.<\/strong><\/p><p>Integram o custo os gastos necessários para colocar a máquina no local e nas condições de funcionamento pretendidas.<\/p><div class=\"table-scroll\"><table><thead><tr><th>Gasto<\/th><th>Integra o custo?<\/th><th>Valor incluído<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Gasto\">Compra<\/td><td data-label=\"Integra o custo?\">Sim<\/td><td data-label=\"Valor incluído\">R$ 200.000,00<\/td><\/tr><tr><td data-label=\"Gasto\">Frete e seguro<\/td><td data-label=\"Integra o custo?\">Sim<\/td><td data-label=\"Valor incluído\">R$ 10.000,00<\/td><\/tr><tr><td data-label=\"Gasto\">Preparação do local e fundação<\/td><td data-label=\"Integra o custo?\">Sim<\/td><td data-label=\"Valor incluído\">R$ 15.000,00<\/td><\/tr><tr><td data-label=\"Gasto\">Treinamento<\/td><td data-label=\"Integra o custo?\">Não<\/td><td data-label=\"Valor incluído\">—<\/td><\/tr><tr><td data-label=\"Gasto\">Testes de funcionamento<\/td><td data-label=\"Integra o custo?\">Sim<\/td><td data-label=\"Valor incluído\">R$ 3.000,00<\/td><\/tr><tr><td data-label=\"Gasto\">Total<\/td><td data-label=\"Integra o custo?\"><\/td><td data-label=\"Valor incluído\">R$ 228.000,00<\/td><\/tr><\/tbody><\/table><\/div><p>O treinamento é reconhecido como despesa, não compondo o custo da máquina.<br>Base: NBC TG 27.<\/p>"}, {"n": 17, "kind": "question", "html": "<p>Uma empresa adquiriu uma marca com vida útil considerada indefinida, um software com vida útil definida e máquinas industriais. Considerando o que estabelecem a NBC TG 01 (R4) – REDUÇÃO AO VALOR RECUPERÁVEL DE ATIVOS, a NBC TG 04 (R4) – ATIVO INTANGÍVEL e a NBC TG 27 (R4) – ATIVO IMOBILIZADO, assinale a opção que apresenta o tratamento contábil correto para o caso.<\/p><p class=\"option\">(A) A empresa inicia a amortização dos intangíveis apenas quando obtém a propriedade legal, mesmo que já esteja utilizando esses ativos.<\/p><p class=\"option\">(B) A empresa amortiza a marca de vida útil indefinida a uma taxa anual fixa de 10%, por não ser possível estimar sua vida útil econômica.<\/p><p class=\"option\">(C) A empresa não amortiza a marca de vida útil indefinida, mas realiza anualmente o teste de redução ao valor recuperável desse ativo.<\/p><p class=\"option\">(D) A empresa utiliza as taxas de depreciação definidas pela legislação fiscal para registrar a depreciação das máquinas nas demonstrações contábeis societárias.<\/p>"}, {"n": 17, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: C.<\/strong><\/p><p>O tratamento é:<\/p><div class=\"table-scroll\"><table><thead><tr><th>Ativo<\/th><th>Tratamento<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Ativo\">Marca com vida útil indefinida<\/td><td data-label=\"Tratamento\">Não amortiza; realiza teste anual de recuperabilidade e também quando houver indicação de perda<\/td><\/tr><tr><td data-label=\"Ativo\">Software com vida útil definida<\/td><td data-label=\"Tratamento\">Amortiza a partir de sua disponibilidade para uso<\/td><\/tr><tr><td data-label=\"Ativo\">Máquinas industriais<\/td><td data-label=\"Tratamento\">Deprecia conforme a vida útil econômica e o padrão de consumo dos benefícios<\/td><\/tr><\/tbody><\/table><\/div><p>A propriedade legal não é o marco exclusivo para iniciar a amortização. A disponibilidade para uso é determinante.<\/p><p>As taxas fiscais também não substituem automaticamente as estimativas contábeis de vida útil das máquinas.<br>Bases: NBC TG 01, NBC TG 04 e NBC TG 27.<\/p>"}, {"n": 18, "kind": "question", "html": "<p>A Sociedade Empresária “A” adquiriu mercadorias para revenda à vista pelo valor bruto de R$ 100.000,00, indicado na nota fiscal do fornecedor. Nessa operação, considere as seguintes informações para a empresa compradora: ICMS (imposto recuperável) incluído na nota fiscal: R$ 18.000,00. Frete para transporte das mercadorias até a empresa, pago pela Sociedade Empresária “A”: R$ 4.000,00. Considerando as regras da NBC TG 16 (R2) – ESTOQUES, o valor inicial a ser registrado na conta de Estoques é de<\/p><p class=\"option\">(A) R$ 86.000,00.<\/p><p class=\"option\">(B) R$ 100.000,00.<\/p><p class=\"option\">(C) R$ 82.000,00.<\/p><p class=\"option\">(D) R$ 104.000,00.<\/p>"}, {"n": 18, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: A — R$ 86.000,00.<\/strong><\/p><p>O ICMS recuperável é excluído do custo. O frete de aquisição é incluído.<\/p><p><strong>Estoque = Valor bruto − ICMS recuperável + Frete.<\/strong><br>Estoque = R$ 100.000,00 − R$ 18.000,00 + R$ 4.000,00.<br><strong>Estoque = R$ 86.000,00.<\/strong><\/p><p>Lançamento conjunto, considerando o pagamento das mercadorias e do frete:<\/p><p><strong>D — Estoques de Mercadorias: R$ 86.000,00<\/strong><br><strong>D — ICMS a Recuperar: R$ 18.000,00<\/strong><br><strong>C — Caixa/Bancos: R$ 104.000,00<\/strong><\/p><p>Base: NBC TG 16.<\/p>"}, {"n": 19, "kind": "question", "html": "<p>O Departamento jurídico da Empresa Ltda. apresentou parecer acerca dos seguintes casos que envolvem situações jurídicas e fiscais em andamento:<\/p><p>• CASO 1: Autuação Fiscal: Auto de infração recebido do fisco Federal. A probabilidade de perda é avaliada como PROVÁVEL, sendo possível fazer uma estimativa confiável do valor.<\/p><p>• CASO 2: Ação Cível: Processo movido por um cliente por danos morais. A probabilidade de perda é classificada como POSSÍVEL.<\/p><p>• CASO 3: Processo Trabalhista: Ação judicial movida por um empregado. Os advogados da empresa classificam a perda como REMOTA. De acordo com as informações do departamento jurídico da empresa e as determinações da NBC TG 25 (R2) – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, assinale a opção correta a respeito da forma como a empresa deve proceder em relação ao reconhecimento contábil e à evidenciação em notas explicativas para os três casos apresentados.<\/p><p class=\"option\">(A) CASO 1: Reconhecer a provisão no Passivo e divulgar em notas explicativas; CASO 2: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa; CASO 3: Não reconhecer e nem divulgar em notas explicativas.<\/p><p class=\"option\">(B) CASO 1: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa; CASO 2: Reconhecer provisão no Passivo; CASO 3: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa.<\/p><p class=\"option\">(C) CASO 1: Não reconhecer e nem divulgar em notas explicativas; CASO 2: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa; CASO 3: Reconhecer provisão no Passivo.<\/p><p class=\"option\">(D) CASO 1: Reconhecer a provisão no Passivo; CASO 2: Não reconhecer e nem divulgar em notas explicativas; CASO 3: Não reconhecer e nem divulgar em notas explicativas.<\/p>"}, {"n": 19, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: A.<\/strong><\/p><div class=\"table-scroll\"><table><thead><tr><th>Caso<\/th><th>Probabilidade<\/th><th>Reconhecimento<\/th><th>Divulgação<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Caso\">1<\/td><td data-label=\"Probabilidade\">Provável, com estimativa confiável<\/td><td data-label=\"Reconhecimento\">Reconhece provisão<\/td><td data-label=\"Divulgação\">Divulga<\/td><\/tr><tr><td data-label=\"Caso\">2<\/td><td data-label=\"Probabilidade\">Possível<\/td><td data-label=\"Reconhecimento\">Não reconhece provisão<\/td><td data-label=\"Divulgação\">Divulga passivo contingente<\/td><\/tr><tr><td data-label=\"Caso\">3<\/td><td data-label=\"Probabilidade\">Remota<\/td><td data-label=\"Reconhecimento\">Não reconhece provisão<\/td><td data-label=\"Divulgação\">Divulgação dispensada<\/td><\/tr><\/tbody><\/table><\/div><p>Essa é a distinção estabelecida pela norma para as situações apresentadas.<\/p><p>A alternativa D erra ao dispensar a divulgação da perda <strong>possível<\/strong> do caso 2.<br>Base: NBC TG 25.<\/p>"}, {"n": 20, "kind": "question", "html": "<p>Relacione os conceitos de bases de mensuração do valor atual previstos na NBC TG ESTRUTURA CONCEITUAL para relatório financeiro, apresentados na primeira coluna, com seus respectivos significados, descritos na segunda coluna.<\/p><p>( ) É o preço que seria recebido pela venda de ativo ou que seria pago pela transferência de passivo em transação ordenada entre participantes do mercado na data de mensuração.<\/p><p>( ) É o valor presente do caixa, ou de outros recursos econômicos, que a entidade espera ser<\/p><p>1. Valor Justo obrigada a transferir para cumprir a obrigação.<\/p><p>2. Valor em uso ( ) É o valor presente dos fluxos de caixa, ou outros benefícios econômicos, que a entidade<\/p><p>3. Custo corrente espera obter do uso de ativo e de sua alienação final.<\/p><p>4. Valor de cumprimento ( ) É a contraprestação que seria paga pelo ativo equivalente na data de mensuração mais os custos de transação que seriam incorridos nessa data, ou a contraprestação que seria recebida pelo passivo equivalente na data de mensuração menos os custos de transação que seriam incorridos nessa data. A relação correta, na ordem apresentada, é:<\/p><p class=\"option\">(A) 4 – 2 – 3 – 1.<\/p><p class=\"option\">(B) 1 – 4 – 2 – 3.<\/p><p class=\"option\">(C) 2 – 3 – 1 – 4.<\/p><p class=\"option\">(D) 3 – 4 – 2 – 1.<\/p>"}, {"n": 20, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: B — 1 – 4 – 2 – 3.<\/strong><\/p><p>As associações são:<\/p><p><strong>1 — Valor justo:<\/strong> preço que seria recebido pela venda do ativo ou pago pela transferência do passivo em transação ordenada entre participantes do mercado na data da mensuração.<\/p><p><strong>4 — Valor de cumprimento:<\/strong> valor presente dos recursos que a entidade espera transferir para cumprir uma obrigação.<\/p><p><strong>2 — Valor em uso:<\/strong> valor presente dos benefícios esperados do uso do ativo e de sua alienação final.<\/p><p><strong>3 — Custo corrente:<\/strong> valor na data atual de um ativo ou passivo equivalente, considerando os custos de transação indicados na definição.<\/p>"}, {"n": 20, "kind": "answer", "part": 2, "parts": 2, "html": "<p>Portanto, na ordem das descrições: <strong>1 – 4 – 2 – 3<\/strong>.<br>Base: Estrutura Conceitual.<\/p>"}, {"n": 21, "kind": "question", "html": "<p>Uma empresa comercial apresentou os seguintes dados e valores referentes à folha de pagamento de seus empregados do mês de agosto de 2026:<\/p><p>• Salários Brutos: R$ 100.000,00, a serem pagos em setembro;<\/p><p>• Contribuição Previdenciária retida dos empregados (INSS): R$ 11.000,00;<\/p><p>• Imposto de Renda Retido na Fonte (IRRF): R$ 4.000,00. Considerando exclusivamente essas informações, assinale a opção que apresenta corretamente o reconhecimento da apropriação dos salários e retenções no mês de agosto de 2026.<\/p><p class=\"option\">(A) Débito – Despesa com Salários (R$ 85.000,00); Débito – Passivo Circulante – INSS a Recolher (R$ 11.000,00); Débito – Passivo Circulante – IRRF a Recolher (R$ 4.000,00), e Crédito – Passivo Circulante – Salários a Pagar (R$ 100.000,00).<\/p><p class=\"option\">(B) Débito – Despesa com Salários (R$ 85.000,00); Débito – Despesa com INSS (R$ 11.0000,00); Débito – Despesa com IRRF (R$ 4.000,00), e Crédito – Passivo não Circulante – Salários a Pagar (R$ 100.000,00).<\/p><p class=\"option\">(C) Débito – Passivo Circulante – Salários a Pagar (R$ 100.000,00); Crédito – Despesa com Salários (R$ 85.000,00); Crédito – Passivo Circulante – INSS a Recolher (R$ 11.000,00), e Crédito – Passivo Circulante – IRRF a Recolher (R$ 4.000,00).<\/p><p class=\"option\">(D) Débito – Despesa com Salários (R$ 100.000,00); Crédito – Passivo Circulante – Salários a Pagar (R$ 85.000,00); Crédito – Passivo Circulante – INSS a Recolher (R$ 11.000,00), e Crédito – Passivo Circulante – IRRF a Recolher (R$ 4.000,00).<\/p>"}, {"n": 21, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: D.<\/strong><\/p><p>A despesa corresponde ao salário <strong>bruto<\/strong>, de R$ 100.000,00.<\/p><p><strong>Salário líquido = R$ 100.000,00 − R$ 11.000,00 − R$ 4.000,00 = R$ 85.000,00.<\/strong><\/p><p><strong>Lançamento<\/strong><br><strong>D — Despesa com Salários: R$ 100.000,00<\/strong><br><strong>C — Salários a Pagar: R$ 85.000,00<\/strong><br><strong>C — INSS a Recolher: R$ 11.000,00<\/strong><br><strong>C — IRRF a Recolher: R$ 4.000,00<\/strong><\/p><p>As retenções são valores descontados dos empregados que a empresa deve recolher aos respectivos órgãos. Elas não diminuem a despesa bruta com salários.<\/p><p>Pelo regime de competência, a despesa pertence a agosto, embora o pagamento ocorra em setembro.<\/p>"}, {"n": 22, "kind": "question", "html": "<p>Em junho de 2026, uma entidade contratou um professor externo para ministrar um curso sobre inteligência artificial a seus empregados, por R$ 12.000,00. O valor foi pago em três parcelas iguais, em junho, julho e agosto de 2026. Metade das aulas foi ministrada em junho, e o restante, em julho. De acordo com o Regime de Competência, a despesa com o professor na Demonstração do Resultado mensal da entidade, em 30/06/2026, foi<\/p><p class=\"option\">(A) zero.<\/p><p class=\"option\">(B) R$ 4.000,00.<\/p><p class=\"option\">(C) R$ 6.000,00.<\/p><p class=\"option\">(D) R$ 12.000,00.<\/p>"}, {"n": 22, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: C — R$ 6.000,00.<\/strong><\/p><p>A despesa acompanha a prestação do serviço, independentemente do pagamento.<\/p><p>Como metade das aulas ocorreu em junho:<br><strong>Despesa de junho = R$ 12.000,00 × 50% = R$ 6.000,00.<\/strong><\/p><p>O pagamento de junho foi de R$ 4.000,00. Portanto, ao final desse mês, permanecem R$ 2.000,00 a pagar relativos ao serviço já recebido.<\/p><p><strong>Lançamento conjunto<\/strong><br><strong>D — Despesa com Treinamento: R$ 6.000,00<\/strong><br><strong>C — Bancos: R$ 4.000,00<\/strong><br><strong>C — Serviços a Pagar: R$ 2.000,00<\/strong><\/p>"}, {"n": 23, "kind": "question", "html": "<p>Em 31/12/2025, a Cia Gama reconheceu a distribuição de R$ 50.000,00 a título de dividendos mínimos obrigatórios. O valor foi pago aos acionistas da empresa em 2026. Ao analisar a Demonstração de Mutações do Patrimônio Líquido anual da Cia Gama, em 31/12/2025, pôde-se constatar que, em decorrência da distribuição dos dividendos obrigatórios, o total do patrimônio líquido<\/p><p class=\"option\">(A) diminuiu.<\/p><p class=\"option\">(B) aumentou.<\/p><p class=\"option\">(C) permaneceu o mesmo, assim como o saldo das contas.<\/p><p class=\"option\">(D) permaneceu o mesmo, mas houve modificações nos saldos das contas.<\/p>"}, {"n": 23, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: A.<\/strong><\/p><p>O reconhecimento dos dividendos mínimos obrigatórios reduz o patrimônio líquido e constitui um passivo.<\/p><p><strong>Em 31/12/2025<\/strong><br><strong>D — Lucros Acumulados/Conta de destinação do resultado: R$ 50.000,00<\/strong><br><strong>C — Dividendos a Pagar: R$ 50.000,00<\/strong><\/p><p><strong>Consequências<\/strong><br>• patrimônio líquido: <strong>redução de R$ 50.000,00<\/strong>;<br>• passivo: aumento de R$ 50.000,00;<br>• caixa: sem alteração nessa data.<\/p><p>O pagamento em 2026 apenas baixa o passivo e reduz o caixa.<\/p>"}, {"n": 24, "kind": "question", "html": "<p>Em 01/01/2025, a Cia XYZ comprou um veículo para utilizar em seus negócios por R$ 50.000,00, à vista. Na data, a entidade planejava utilizar o veículo durante cinco anos. No entanto, em 31/12/2025, os gestores da Cia XYZ constataram que o veículo era pouco utilizado e o venderam por R$ 42.000,00, à vista. A Cia XYZ utiliza o método da linha reta para depreciar os seus ativos imobilizados e considera valor residual nulo. Considerando apenas esses fatos, em 31/12/2025, na Demonstração dos Fluxos de Caixa anual da entidade, a atividade de investimento<\/p><p class=\"option\">(A) gerou líquido R$ 2.000,00.<\/p><p class=\"option\">(B) gerou líquido R$ 42.000,00.<\/p><p class=\"option\">(C) consumiu líquido R$ 8.000,00.<\/p><p class=\"option\">(D) consumiu líquido R$ 10.000,00.<\/p>"}, {"n": 24, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: C — consumiu líquido R$ 8.000,00.<\/strong><\/p><p>Na DFC anual, consideramos tanto a aquisição quanto a venda:<\/p><div class=\"table-scroll\"><table><thead><tr><th>Fluxo de investimento<\/th><th>Valor<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Fluxo de investimento\">Pagamento pela compra do veículo<\/td><td data-label=\"Valor\">− R$ 50.000,00<\/td><\/tr><tr><td data-label=\"Fluxo de investimento\">Recebimento pela venda do veículo<\/td><td data-label=\"Valor\">+ R$ 42.000,00<\/td><\/tr><tr><td data-label=\"Fluxo de investimento\">Fluxo líquido<\/td><td data-label=\"Valor\">− R$ 8.000,00<\/td><\/tr><\/tbody><\/table><\/div><p><strong>A depreciação não representa saída de caixa.<\/strong><\/p><p><strong>Para distinguir resultado e fluxo de caixa<\/strong><br>Depreciação anual = R$ 50.000,00 ÷ 5 = R$ 10.000,00.<br>Valor contábil na venda = R$ 40.000,00.<br>Ganho na venda = R$ 42.000,00 − R$ 40.000,00 = R$ 2.000,00.<\/p><p>Esse ganho de R$ 2.000,00 não é o fluxo líquido de investimento.<\/p>"}, {"n": 25, "kind": "question", "html": "<p>Em 31/12/2025, a Cia. KMLK não apresentou, em sua Demonstração do Valor Adicionado, saldo no item “Valor Adicionado Recebido em Transferência”. O fato de a empresa não apresentar valor nesse item pode indicar que a Cia. KMLK<\/p><p class=\"option\">(A) presta as suas atividades em imóvel próprio.<\/p><p class=\"option\">(B) não possui investimento em controladas e coligadas.<\/p><p class=\"option\">(C) não reconheceu perda de recuperabilidade de seus ativos.<\/p><p class=\"option\">(D) tem todo o serviço realizado por mão de obra contratada.<\/p>"}, {"n": 25, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: B.<\/strong><\/p><p>O valor adicionado recebido em transferência inclui, entre outros componentes, o <strong>resultado de equivalência patrimonial<\/strong> e as receitas financeiras. A ausência de investimentos em controladas e coligadas pode explicar a inexistência do componente de equivalência patrimonial.<\/p><p>Observe o cuidado da questão: ela afirma <strong>“pode indicar”<\/strong>. Saldo zero nesse grupo não prova, isoladamente, que a empresa não possui esses investimentos.<\/p><p>As outras alternativas se referem a aspectos que não explicam diretamente a ausência desse item: imóvel utilizado, perda de recuperabilidade e contratação de mão de obra.<br>Base: NBC TG 09.<\/p>"}, {"n": 26, "kind": "question", "html": "<p>Em 31/12/2025, a Cia. Alfa apresentava os seguintes saldos em seu Balanço Patrimonial:<\/p><p>• Disponibilidades: R$ 300.000,00;<\/p><p>• Capital Social: R$ 300.000,00. Já a Cia. Beta apresentava os seguintes saldos:<\/p><p>• Disponibilidades: R$ 12.000,00;<\/p><p>• Terrenos: R$ 40.000,00;<\/p><p>• Capital Social: R$ 52.000,00. Em 01/01/2026, a Cia. Alfa adquiriu 100% de participação na Cia. Beta por R$ 90.000,00, que corresponde ao valor justo dessa participação. Na data, foi avaliado que os terrenos tinham valor de mercado de R$ 45.000,00. Além disso, no processo de apropriação do preço pago, foi atribuído à marca da Cia. Beta um valor de R$ 18.000,00. Ainda, foi avaliado que a Cia. Beta possuía empregados bem treinados e com grande capacidade de geração de benefícios futuros. Assinale a opção que indica o goodwill reconhecido pela Cia. Alfa na data da compra, em seu Balanço Patrimonial, de acordo com a NBC TG 15 (R4) – COMBINAÇÃO DE NEGÓCIOS.<\/p><p class=\"option\">(A) R$ 15.000,00.<\/p><p class=\"option\">(B) R$ 27.000,00.<\/p><p class=\"option\">(C) R$ 33.000,00.<\/p><p class=\"option\">(D) R$ 38.000,00.<\/p>"}, {"n": 26, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: A — R$ 15.000,00.<\/strong><\/p><p>Primeiro, apuramos os ativos líquidos identificáveis a valor justo:<\/p><div class=\"table-scroll\"><table><thead><tr><th>Elemento<\/th><th>Valor justo<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Elemento\">Disponibilidades<\/td><td data-label=\"Valor justo\">R$ 12.000,00<\/td><\/tr><tr><td data-label=\"Elemento\">Terrenos<\/td><td data-label=\"Valor justo\">R$ 45.000,00<\/td><\/tr><tr><td data-label=\"Elemento\">Marca identificável<\/td><td data-label=\"Valor justo\">R$ 18.000,00<\/td><\/tr><tr><td data-label=\"Elemento\">Total<\/td><td data-label=\"Valor justo\">R$ 75.000,00<\/td><\/tr><\/tbody><\/table><\/div><p>Não foram informados passivos.<\/p><p><strong>Goodwill = Preço pago − Ativos líquidos identificáveis a valor justo.<\/strong><br>Goodwill = R$ 90.000,00 − R$ 75.000,00.<br><strong>Goodwill = R$ 15.000,00.<\/strong><\/p><p>Os empregados treinados não são reconhecidos como um ativo identificável separado na aquisição. O valor associado à força de trabalho organizada integra o goodwill.<\/p><p><strong>A composição do investimento é:<\/strong><\/p>"}, {"n": 26, "kind": "answer", "part": 2, "parts": 2, "html": "<div class=\"table-scroll\"><table><thead><tr><th>Componente<\/th><th>Valor<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Componente\">Participação no patrimônio líquido contábil<\/td><td data-label=\"Valor\">R$ 52.000,00<\/td><\/tr><tr><td data-label=\"Componente\">Mais-valia dos terrenos<\/td><td data-label=\"Valor\">R$ 5.000,00<\/td><\/tr><tr><td data-label=\"Componente\">Marca identificável<\/td><td data-label=\"Valor\">R$ 18.000,00<\/td><\/tr><tr><td data-label=\"Componente\">Goodwill<\/td><td data-label=\"Valor\">R$ 15.000,00<\/td><\/tr><tr><td data-label=\"Componente\">Preço pago<\/td><td data-label=\"Valor\">R$ 90.000,00<\/td><\/tr><\/tbody><\/table><\/div><p>Base: NBC TG 15.<\/p>"}, {"n": 27, "kind": "question", "html": "<p>A companhia Delta possuía, em 31/12/2025: numerário em caixa no valor de R$ 40.000,00; valores a receber de no valor de R$ 10.000,00 referentes a vendas entregues; e patrimônio líquido no valor de R$ 50.000,00. Em janeiro de 2026, a diretoria da empresa aprovou a intenção de comprar novos equipamentos avaliados em R$ 30.000,00 no mês seguinte. Concomitantemente, a entidade firmou um contrato para serviços de manutenção, ainda não prestados, a terceiro, no valor de R$ 15.000,00. Nenhum valor foi recebido. Por fim, a contabilidade reconheceu uma dívida de R$ 25.000,00 referente à compra de matérias-primas que já foram recebidas no estoque. O contador da companhia apura os totais monetários que cumprem, rigorosamente, as definições contábeis exigidas pela norma. Em relação à classificação e à totalização dos elementos patrimoniais descritos, avalie se cada afirmativa a seguir é verdadeira (V) ou falsa (F).<\/p><p>I. O total de ativos da entidade soma R$ 80.000,00, uma vez que a intenção de aquisição futura dos equipamentos atende à definição normativa de recurso econômico presente controlado por evento passado.<\/p><p>II. O passivo da entidade totaliza estritamente R$ 25.000,00, caracterizando-se como a única obrigação presente de transferir um recurso econômico resultante da ocorrência de um evento já passado.<\/p><p>III. O contrato de manutenção firmado eleva as obrigações para R$ 40.000,00, pois a assinatura documental por si só caracteriza o recebimento de benefícios econômicos e o surgimento de um passivo imediato. À luz das definições de ativos e passivos preconizadas pela NBC TG ESTRUTURA CONCEITUAL, está correto o que se afirma em<\/p><p class=\"option\">(A) I e III, apenas.<\/p><p class=\"option\">(B) III, apenas.<\/p><p class=\"option\">(C) II, apenas.<\/p><p class=\"option\">(D) I e II, apenas.<\/p>"}, {"n": 27, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: C — II, apenas.<\/strong><\/p><p><strong>I — Falsa.<\/strong> A intenção de comprar equipamentos não constitui um ativo presente. Além disso, as matérias-primas recebidas integram o estoque.<\/p><p>Ativo total:<br>R$ 40.000,00 + R$ 10.000,00 + R$ 25.000,00.<br><strong>Ativo total = R$ 75.000,00.<\/strong><\/p><p><strong>II — Verdadeira.<\/strong> As matérias-primas já foram recebidas, surgindo a obrigação de pagar R$ 25.000,00.<\/p><p><strong>III — Falsa.<\/strong> A mera assinatura do contrato de manutenção, sem prestação do serviço ou recebimento de valores, não gera o passivo de R$ 15.000,00 descrito na afirmativa.<\/p><p>A posição resultante é:<br><strong>Ativo: R$ 75.000,00 = Passivo: R$ 25.000,00 + PL: R$ 50.000,00.<\/strong><\/p>"}, {"n": 28, "kind": "question", "html": "<p>Ao longo de 2021, a Controladora Alfa vendeu mercadorias para sua controlada Beta por R$ 500.000,00. O custo das mercadorias era de R$ 350.000,00. Em 31/12/2021, 40% dessas mercadorias permaneciam em estoque na controlada. Na elaboração das demonstrações consolidadas de acordo com a NBC TG 36 (R3) – DEMONSTRAÇÕES CONSOLIDADAS, o lucro não realizado que deverá ser eliminado é de<\/p><p class=\"option\">(A) R$ 60.000,00.<\/p><p class=\"option\">(B) R$ 90.000,00.<\/p><p class=\"option\">(C) R$ 120.000,00.<\/p><p class=\"option\">(D) R$ 150.000,00.<\/p>"}, {"n": 28, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: A — R$ 60.000,00.<\/strong><\/p><p>Lucro na venda entre as empresas:<br>R$ 500.000,00 − R$ 350.000,00 = <strong>R$ 150.000,00.<\/strong><\/p><p>Como 40% das mercadorias permanecem dentro do grupo:<br><strong>Lucro não realizado = R$ 150.000,00 × 40% = R$ 60.000,00.<\/strong><\/p><p>Esse lucro é eliminado nas demonstrações consolidadas porque ainda não foi realizado mediante venda a terceiros externos ao grupo.<\/p><p><strong>Conferência<\/strong><\/p><div class=\"table-scroll\"><table><thead><tr><th>Estoque remanescente<\/th><th>Valor<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Estoque remanescente\">Registrado na controlada: R$ 500.000,00 × 40%<\/td><td data-label=\"Valor\">R$ 200.000,00<\/td><\/tr><tr><td data-label=\"Estoque remanescente\">Custo para o grupo: R$ 350.000,00 × 40%<\/td><td data-label=\"Valor\">R$ 140.000,00<\/td><\/tr><tr><td data-label=\"Estoque remanescente\">Lucro embutido a eliminar<\/td><td data-label=\"Valor\">R$ 60.000,00<\/td><\/tr><\/tbody><\/table><\/div><p>Base: NBC TG 36.<\/p>"}, {"n": 29, "kind": "question", "html": "<p>A empresa “F” S.A. iniciou suas atividades em 01/11/2025 com as seguintes operações no primeiro mês:<\/p><p>• Subscrição e integralização total de Capital no valor de R$ 200.000,00 em depósito bancário.<\/p><p>• Compra de mercadorias para revenda no valor de R$ 50.000,00, a prazo, para pagamento em 60 dias.<\/p><p>• Prestação de serviços a clientes no valor de R$ 30.000,00, recebida integralmente à vista, por PIX.<\/p><p>• Pagamento à vista de despesas gerais do mês no valor de R$ 5.000,00. Considerando apenas as operações descritas e aplicando o regime de competência para a apuração do resultado do exercício, os valores do Ativo Total e do Patrimônio Líquido no Balanço Patrimonial de 30/11/2025 foram, respectivamente,<\/p><p class=\"option\">(A) R$ 225.000,00 e R$ 225.000,00.<\/p><p class=\"option\">(B) R$ 275.000,00 e R$ 225.000,00.<\/p><p class=\"option\">(C) R$ 275.000,00 e R$ 200.000,00.<\/p><p class=\"option\">(D) R$ 225.000,00 e R$ 175.000,00.<\/p>"}, {"n": 29, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: B — Ativo de R$ 275.000,00 e PL de R$ 225.000,00.<\/strong><\/p><p><strong>Lançamentos — Subscrição<\/strong><br><strong>D — Capital a Integralizar: R$ 200.000,00<\/strong><br><strong>C — Capital Social: R$ 200.000,00<\/strong><\/p><p><strong>Integralização<\/strong><br><strong>D — Bancos: R$ 200.000,00<\/strong><br><strong>C — Capital a Integralizar: R$ 200.000,00<\/strong><\/p><p><strong>Compra<\/strong><br><strong>D — Estoques: R$ 50.000,00<\/strong><br><strong>C — Fornecedores: R$ 50.000,00<\/strong><\/p><p><strong>Prestação de serviços<\/strong><br><strong>D — Bancos: R$ 30.000,00<\/strong><br><strong>C — Receita de Serviços: R$ 30.000,00<\/strong><\/p><p><strong>Despesas<\/strong><br><strong>D — Despesas Gerais: R$ 5.000,00<\/strong><br><strong>C — Bancos: R$ 5.000,00<\/strong><\/p>"}, {"n": 29, "kind": "answer", "part": 2, "parts": 2, "html": "<p><strong>Apuração<\/strong><br>Bancos = R$ 200.000,00 + R$ 30.000,00 − R$ 5.000,00 = <strong>R$ 225.000,00.<\/strong><br>Lucro = R$ 30.000,00 − R$ 5.000,00 = <strong>R$ 25.000,00.<\/strong><\/p><div class=\"table-scroll\"><table><thead><tr><th>Ativo<\/th><th>Valor<\/th><th>Passivo e PL<\/th><th>Valor<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Ativo\">Bancos<\/td><td data-label=\"Valor\">R$ 225.000,00<\/td><td data-label=\"Passivo e PL\">Fornecedores<\/td><td data-label=\"Valor\">R$ 50.000,00<\/td><\/tr><tr><td data-label=\"Ativo\">Estoques<\/td><td data-label=\"Valor\">R$ 50.000,00<\/td><td data-label=\"Passivo e PL\">Capital Social<\/td><td data-label=\"Valor\">R$ 200.000,00<\/td><\/tr><tr><td data-label=\"Ativo\"><\/td><td data-label=\"Valor\"><\/td><td data-label=\"Passivo e PL\">Lucro<\/td><td data-label=\"Valor\">R$ 25.000,00<\/td><\/tr><tr><td data-label=\"Ativo\">Total<\/td><td data-label=\"Valor\">R$ 275.000,00<\/td><td data-label=\"Passivo e PL\">Total<\/td><td data-label=\"Valor\">R$ 275.000,00<\/td><\/tr><\/tbody><\/table><\/div><p><strong>PL = R$ 200.000,00 + R$ 25.000,00 = R$ 225.000,00.<\/strong><\/p><p>A compra de mercadorias aumenta o estoque; não constitui despesa enquanto essas mercadorias não forem vendidas ou consumidas.<\/p>"}, {"n": 30, "kind": "question", "html": "<p>Em 10/06/2025, a empresa “CD” S.A. realizou, em 10/06/20X5, o pagamento em atraso de uma duplicata de sua responsabilidade no valor nominal de R$ 10.000,00. Em decorrência do atraso, a instituição bancária processou uma transferência eletrônica total no valor de R$ 10.500,00, sendo liquidadas as condições contratuais com a inclusão de R$ 500,00 relativos a juros de mora, uma despesa financeira. O contador, ao registrar a operação no livro diário, deve realizar o seguinte lançamento contábil:<\/p><p class=\"option\">(A) Débito: Duplicatas a pagar R$ 10.000,00 Débito: Despesas com juros R$ 500,00 Crédito: Bancos R$ 10.500,00<\/p><p class=\"option\">(B) Débito: Duplicatas a pagar R$ 10.500,00 Crédito: Bancos R$ 10.500,00<\/p><p class=\"option\">(C) Débito: Duplicatas a pagar R$ 11.000,00 Crédito: Despesas com juros R$ 500,00 Crédito: Bancos R$ 10.500,00<\/p><p class=\"option\">(D) Débito: Bancos R$ 10.500,00 Crédito: Duplicatas a pagar R$ 10.000,00 Crédito: Despesas com juros R$ 500,00<\/p>"}, {"n": 30, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: A.<\/strong><\/p><p>O lançamento deve:<br>• baixar a obrigação original de R$ 10.000,00 por débito;<br>• reconhecer a despesa financeira de R$ 500,00 por débito;<br>• registrar a saída bancária de R$ 10.500,00 por crédito.<\/p><p><strong>D — Duplicatas a Pagar: R$ 10.000,00<\/strong><br><strong>D — Despesas com Juros: R$ 500,00<\/strong><br><strong>C — Bancos: R$ 10.500,00<\/strong><\/p><p>Total dos débitos = total dos créditos = <strong>R$ 10.500,00.<\/strong><\/p>"}, {"n": 31, "kind": "question", "html": "<p>O departamento de contabilidade da empresa &quot;Qui” S.A. extraiu os seguintes saldos das suas contas patrimoniais em 31/12/20X5, antes da estruturação final do Balanço Patrimonial:<\/p><p>• Caixa e equivalentes de caixa: R$ 15.000,00;<\/p><p>• Duplicatas a receber (vencimento em até 60 dias): R$ 45.000,00;<\/p><p>• Perdas estimadas com créditos de liquidação duvidosa: R$ 2.000,00;<\/p><p>• Estoques de mercadorias para revenda: R$ 25.000,00;<\/p><p>• Adiantamento a fornecedor de curto prazo: R$ 10.000,00;<\/p><p>• Adiantamento de Clientes: R$ 14.000,00;<\/p><p>• Veículos para uso nas entregas: R$ 50.000,00;<\/p><p>• Fornecedores (vencimento em 90 dias): R$ 30.000,00. Com base estritamente nas normas de apresentação e classificação do Balanço Patrimonial, assinale a opção que apresenta o valor total líquido a ser evidenciado no subgrupo do Ativo Circulante.<\/p><p class=\"option\">(A) R$ 83.000,00.<\/p><p class=\"option\">(B) R$ 93.000,00.<\/p><p class=\"option\">(C) R$ 95.000,00.<\/p><p class=\"option\">(D) R$ 97.000,00.<\/p>"}, {"n": 31, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: B — R$ 93.000,00.<\/strong><\/p><div class=\"table-scroll\"><table><thead><tr><th>Conta do Ativo Circulante<\/th><th>Valor<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Conta do Ativo Circulante\">Caixa e equivalentes de caixa<\/td><td data-label=\"Valor\">R$ 15.000,00<\/td><\/tr><tr><td data-label=\"Conta do Ativo Circulante\">Duplicatas a receber<\/td><td data-label=\"Valor\">R$ 45.000,00<\/td><\/tr><tr><td data-label=\"Conta do Ativo Circulante\">(−) Perdas estimadas com créditos<\/td><td data-label=\"Valor\">− R$ 2.000,00<\/td><\/tr><tr><td data-label=\"Conta do Ativo Circulante\">Estoques<\/td><td data-label=\"Valor\">R$ 25.000,00<\/td><\/tr><tr><td data-label=\"Conta do Ativo Circulante\">Adiantamento a fornecedor<\/td><td data-label=\"Valor\">R$ 10.000,00<\/td><\/tr><tr><td data-label=\"Conta do Ativo Circulante\">Ativo Circulante líquido<\/td><td data-label=\"Valor\">R$ 93.000,00<\/td><\/tr><\/tbody><\/table><\/div><p><strong>AC = R$ 15.000,00 + R$ 45.000,00 − R$ 2.000,00 + R$ 25.000,00 + R$ 10.000,00.<\/strong><\/p><p>Não entram no cálculo:<br>• adiantamento de clientes: <strong>passivo<\/strong>;<br>• veículos para entregas: <strong>ativo não circulante — imobilizado<\/strong>;<br>• fornecedores: <strong>passivo<\/strong>.<\/p>"}, {"n": 31, "kind": "answer", "part": 2, "parts": 2, "html": "<p>O adiantamento <strong>a fornecedor<\/strong> é um direito. O adiantamento <strong>de clientes<\/strong> é uma obrigação.<\/p>"}, {"n": 32, "kind": "question", "html": "<p>A empresa “Q” construiu uma máquina em 2024 para utilizar na fabricação do seu principal produto. Os custos para a construção foram de R$ 410.000,00. Esse ativo passou a estar em condições de funcionamento em 01/02/2025. Nesse momento, foi estimado que o ativo seria vendido ao final de sua vida útil por R$ 50.000,00. A vida útil estimada foi de 30 anos. Devido a uma mudança nas condições de mercado, em 01/11/2025 foi realizada uma nova estimativa de vida útil, que passou a ser de 25 anos, a partir da data da nova mensuração, enquanto o valor de venda estimado ao final da utilização do ativo passou para R$ 30.000,00. A empresa “Q” utiliza o método linear para o cálculo da depreciação e apura e divulga demonstrações contábeis mensalmente. Com base nessas informações, assinale a opção que apresenta a despesa de depreciação que deve ser registrada em 2025.<\/p><p class=\"option\">(A) R$ 13.527,51.<\/p><p class=\"option\">(B) R$ 13.933,33.<\/p><p class=\"option\">(C) R$ 11.473,33.<\/p><p class=\"option\">(D) R$ 11.000,00.<\/p>"}, {"n": 32, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: C — R$ 11.473,33.<\/strong><\/p><p>A depreciação começa quando a máquina fica disponível para uso, em <strong>01/02/2025<\/strong>. A revisão da vida útil e do valor residual produz efeitos prospectivos.<\/p><p><strong>1. Depreciação de fevereiro a outubro: 9 meses<\/strong><br>Base depreciável inicial:<br>R$ 410.000,00 − R$ 50.000,00 = <strong>R$ 360.000,00.<\/strong><\/p><p>Depreciação mensal:<br>R$ 360.000,00 ÷ (30 × 12) = <strong>R$ 1.000,00.<\/strong><\/p><p>Depreciação dos 9 meses:<br>R$ 1.000,00 × 9 = <strong>R$ 9.000,00.<\/strong><\/p><p><strong>2. Valor contábil em 01/11/2025<\/strong><br>R$ 410.000,00 − R$ 9.000,00 = <strong>R$ 401.000,00.<\/strong><\/p><p><strong>3. Nova depreciação mensal<\/strong><br>Nova base depreciável:<br>R$ 401.000,00 − R$ 30.000,00 = <strong>R$ 371.000,00.<\/strong><\/p>"}, {"n": 32, "kind": "answer", "part": 2, "parts": 2, "html": "<p>A nova vida útil é de <strong>25 anos a partir da revisão<\/strong>, equivalentes a 300 meses:<br>R$ 371.000,00 ÷ 300 = <strong>R$ 1.236,6667 por mês.<\/strong><\/p><p><strong>4. Depreciação de novembro e dezembro<\/strong><br>R$ 1.236,6667 × 2 = <strong>R$ 2.473,33.<\/strong><\/p><p><strong>5. Total de 2025<\/strong><br>R$ 9.000,00 + R$ 2.473,33 = <strong>R$ 11.473,33.<\/strong><\/p><p>Não se recalcula a depreciação dos meses anteriores.<br>Base: NBC TG 27 e tratamento de mudança de estimativa contábil.<\/p>"}, {"n": 33, "kind": "question", "html": "<p>Uma empresa possuía no início do mês saldo na conta de estoques no valor de R$ 8.000,00, representando 100 unidades. Ao longo do mês realizou as seguintes operações:<\/p><p>• Dia 2: aquisição de 100 unidades por R$ 100,00 cada;<\/p><p>• Dia 10: venda de 100 unidades por R$ 200,00 cada;<\/p><p>• Dia 15: aquisição de 200 unidades por R$ 120,00 cada;<\/p><p>• Dia 20: venda de 200 unidades por R$ 230,00 cada;<\/p><p>• Dia 25: aquisição de 100 unidades por R$ 130,00 cada. Desconsiderando qualquer tributação sobre as operações e sabendo que a empresa adota o custo médio ponderado móvel como método de mensuração de seus estoques, o valor do saldo final de estoques dessa empresa é de<\/p><p class=\"option\">(A) R$ 21.000,00.<\/p><p class=\"option\">(B) R$ 22.000,00.<\/p><p class=\"option\">(C) R$ 24.000,00.<\/p><p class=\"option\">(D) R$ 25.000,00.<\/p>"}, {"n": 33, "kind": "answer", "part": 1, "parts": 3, "html": "<p><strong>Resposta: C — R$ 24.000,00.<\/strong><\/p><p>No custo médio ponderado móvel, recalculamos o custo médio após cada aquisição.<\/p><p><strong>Estoque inicial<\/strong><br>100 unidades por R$ 8.000,00:<br><strong>Custo unitário = R$ 80,00.<\/strong><\/p><p><strong>Dia 2 — compra de 100 unidades por R$ 100,00<\/strong><br>Valor da compra = R$ 10.000,00.<br>Novo saldo:<br>• quantidade: 200 unidades;<br>• valor: R$ 18.000,00;<br>• custo médio: R$ 18.000,00 ÷ 200 = <strong>R$ 90,00<\/strong>.<\/p><p><strong>Dia 10 — venda de 100 unidades<\/strong><br>Baixa pelo custo médio:<br>100 × R$ 90,00 = <strong>R$ 9.000,00.<\/strong><br>Saldo: <strong>100 unidades por R$ 9.000,00.<\/strong><\/p>"}, {"n": 33, "kind": "answer", "part": 2, "parts": 3, "html": "<p><strong>Dia 15 — compra de 200 unidades por R$ 120,00<\/strong><br>Valor da compra = R$ 24.000,00.<br>Novo saldo:<br>• quantidade: 300 unidades;<br>• valor: R$ 9.000,00 + R$ 24.000,00 = R$ 33.000,00;<br>• custo médio: R$ 33.000,00 ÷ 300 = <strong>R$ 110,00<\/strong>.<\/p><p><strong>Dia 20 — venda de 200 unidades<\/strong><br>Baixa pelo custo médio:<br>200 × R$ 110,00 = <strong>R$ 22.000,00.<\/strong><br>Saldo: <strong>100 unidades por R$ 11.000,00.<\/strong><\/p><p><strong>Dia 25 — compra de 100 unidades por R$ 130,00<\/strong><br>Valor da compra = R$ 13.000,00.<br><strong>Estoque final = R$ 11.000,00 + R$ 13.000,00 = R$ 24.000,00.<\/strong><\/p>"}, {"n": 33, "kind": "answer", "part": 3, "parts": 3, "html": "<div class=\"table-scroll\"><table><thead><tr><th>Movimento<\/th><th>Quantidade em saldo<\/th><th>Valor em saldo<\/th><th>Custo médio<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Movimento\">Inicial<\/td><td data-label=\"Quantidade em saldo\">100<\/td><td data-label=\"Valor em saldo\">R$ 8.000,00<\/td><td data-label=\"Custo médio\">R$ 80,00<\/td><\/tr><tr><td data-label=\"Movimento\">Compra — dia 2<\/td><td data-label=\"Quantidade em saldo\">200<\/td><td data-label=\"Valor em saldo\">R$ 18.000,00<\/td><td data-label=\"Custo médio\">R$ 90,00<\/td><\/tr><tr><td data-label=\"Movimento\">Venda — dia 10<\/td><td data-label=\"Quantidade em saldo\">100<\/td><td data-label=\"Valor em saldo\">R$ 9.000,00<\/td><td data-label=\"Custo médio\">R$ 90,00<\/td><\/tr><tr><td data-label=\"Movimento\">Compra — dia 15<\/td><td data-label=\"Quantidade em saldo\">300<\/td><td data-label=\"Valor em saldo\">R$ 33.000,00<\/td><td data-label=\"Custo médio\">R$ 110,00<\/td><\/tr><tr><td data-label=\"Movimento\">Venda — dia 20<\/td><td data-label=\"Quantidade em saldo\">100<\/td><td data-label=\"Valor em saldo\">R$ 11.000,00<\/td><td data-label=\"Custo médio\">R$ 110,00<\/td><\/tr><tr><td data-label=\"Movimento\">Compra — dia 25<\/td><td data-label=\"Quantidade em saldo\">200<\/td><td data-label=\"Valor em saldo\">R$ 24.000,00<\/td><td data-label=\"Custo médio\">R$ 120,00<\/td><\/tr><\/tbody><\/table><\/div><p>Os preços de venda de R$ 200,00 e R$ 230,00 são utilizados para calcular a receita, não a baixa do estoque.<\/p>"}, {"n": 34, "kind": "question", "html": "<p>A Fábrica de Utensílios Domésticos JP Ltda. realiza sua produção em um único departamento, fabricando dois tipos de colheres: colheres de sobremesa e colheres de sopa. Em determinado período, foram apurados os seguintes dados: Colheres de sobremesa:<\/p><p>• Mão de obra direta (MOD): R$ 26.250,00;<\/p><p>• Material direto: R$ 12.000,00;<\/p><p>• Tempo de produção (horas/máquina): 22.400. Colheres de sopa:<\/p><p>• Mão de obra direta (MOD): R$ 8.750,00;<\/p><p>• Material direto: R$ 18.000,00;<\/p><p>• Tempo de produção (horas/máquina): 9.600. O valor total dos Custos Indiretos de Produção (CIP) no período foi de R$ 140.000,00. Com base nessas informações, assinale a afirmativa correta.<\/p><p class=\"option\">(A) R$ 35.000,00 de CIP foram alocados às colheres de sopa, utilizando-se o critério da proporcionalidade ao custo de Mão de Obra Direta (MOD).<\/p><p class=\"option\">(B) R$ 84.000,00 de CIP foram alocados às colheres de sobremesa, utilizando-se o critério da proporcionalidade ao custo de Material Direto.<\/p><p class=\"option\">(C) R$ 98.000,00 de CIP foram alocados às colheres de sopa, utilizando-se o critério da proporcionalidade ao tempo de Horas/Máquina.<\/p><p class=\"option\">(D) R$ 56.000,00 de CIP foram alocados às colheres de sobremesa, utilizando-se o critério da proporcionalidade ao custo de mão de obra direta (MOD).<\/p>"}, {"n": 34, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: A — R$ 35.000,00.<\/strong><\/p><p>O rateio segue a fórmula:<br><strong>CIP do produto = CIP total × participação do produto na base de rateio.<\/strong><\/p><p>Pela mão de obra direta:<br>MOD total = R$ 26.250,00 + R$ 8.750,00 = <strong>R$ 35.000,00.<\/strong><\/p><p>Participação das colheres de sopa:<br>R$ 8.750,00 ÷ R$ 35.000,00 = <strong>25%.<\/strong><\/p><p>CIP das colheres de sopa:<br>R$ 140.000,00 × 25% = <strong>R$ 35.000,00.<\/strong><\/p><p><strong>Conferindo todas as bases<\/strong><\/p><div class=\"table-scroll\"><table><thead><tr><th>Base de rateio<\/th><th>Sobremesa<\/th><th>Sopa<\/th><\/tr><\/thead
