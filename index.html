><tbody><tr><td data-label=\"Base de rateio\">MOD: 75% e 25%<\/td><td data-label=\"Sobremesa\">R$ 105.000,00<\/td><td data-label=\"Sopa\">R$ 35.000,00<\/td><\/tr><tr><td data-label=\"Base de rateio\">Material direto: 40% e 60%<\/td><td data-label=\"Sobremesa\">R$ 56.000,00<\/td><td data-label=\"Sopa\">R$ 84.000,00<\/td><\/tr><tr><td data-label=\"Base de rateio\">Horas/máquina: 70% e 30%<\/td><td data-label=\"Sobremesa\">R$ 98.000,00<\/td><td data-label=\"Sopa\">R$ 42.000,00<\/td><\/tr><\/tbody><\/table><\/div>"}, {"n": 34, "kind": "answer", "part": 2, "parts": 2, "html": "<p><strong>B:<\/strong> R$ 84.000,00 corresponde às colheres de <strong>sopa<\/strong> pelo material direto.<\/p><p><strong>C:<\/strong> R$ 98.000,00 corresponde às colheres de <strong>sobremesa<\/strong> pelas horas/máquina.<\/p><p><strong>D:<\/strong> R$ 56.000,00 corresponde às colheres de sobremesa pelo <strong>material direto<\/strong>, não pela MOD.<\/p>"}, {"n": 35, "kind": "question", "html": "<p>A empresa Roupas em Linho LTDA. produz camisas e camisetas. Os dados relacionados aos dois produtos são apresentados a seguir:<\/p><p><div class=\"table-scroll\"><table><thead><tr><th>Descrição<\/th><th>Camisas<\/th><th>Camisetas<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Descrição\">Quantidade Produzida<\/td><td data-label=\"Camisas\">500<\/td><td data-label=\"Camisetas\">450<\/td><\/tr><\/tbody><\/table><\/div> A empresa fez o seguinte levantamento dos Custos das Atividades e Direcionadores<\/p><p><div class=\"table-scroll\"><table><thead><tr><th>Departamento<\/th><th>Atividades<\/th><th>Direcionadores<\/th><th>Custos<\/th><th>Camisas<\/th><th>Camisetas<\/th><th>Total<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Departamento\">Compras<\/td><td data-label=\"Atividades\">Comprar Materiais<\/td><td data-label=\"Direcionadores\">nº de pedidos<\/td><td data-label=\"Custos\">20.000,00<\/td><td data-label=\"Camisas\">200<\/td><td data-label=\"Camisetas\">100<\/td><td data-label=\"Total\">300<\/td><\/tr><tr><td data-label=\"Departamento\">Compras<\/td><td data-label=\"Atividades\">Desenvolver Fornecedores<\/td><td data-label=\"Direcionadores\">nº de fornecedores<\/td><td data-label=\"Custos\">12.000,00<\/td><td data-label=\"Camisas\">4<\/td><td data-label=\"Camisetas\">6<\/td><td data-label=\"Total\">10<\/td><\/tr><tr><td data-label=\"Departamento\">Corte e Costura<\/td><td data-label=\"Atividades\">Cortar<\/td><td data-label=\"Direcionadores\">tempo de corte<\/td><td data-label=\"Custos\">25.000,00<\/td><td data-label=\"Camisas\">6<\/td><td data-label=\"Camisetas\">6<\/td><td data-label=\"Total\">12<\/td><\/tr><tr><td data-label=\"Departamento\">Corte e Costura<\/td><td data-label=\"Atividades\">Colar<\/td><td data-label=\"Direcionadores\">tempo para colar<\/td><td data-label=\"Custos\">25.600,00<\/td><td data-label=\"Camisas\">16<\/td><td data-label=\"Camisetas\">8<\/td><td data-label=\"Total\">24<\/td><\/tr><tr><td data-label=\"Departamento\">Acabamento<\/td><td data-label=\"Atividades\">Acabar<\/td><td data-label=\"Direcionadores\">tempo de acabamento<\/td><td data-label=\"Custos\">18.000,00<\/td><td data-label=\"Camisas\">4<\/td><td data-label=\"Camisetas\">10<\/td><td data-label=\"Total\">14<\/td><\/tr><tr><td data-label=\"Departamento\">Acabamento<\/td><td data-label=\"Atividades\">Despachar Produtos<\/td><td data-label=\"Direcionadores\">tempo de despacho<\/td><td data-label=\"Custos\">30.200,00<\/td><td data-label=\"Camisas\">5<\/td><td data-label=\"Camisetas\">5<\/td><td data-label=\"Total\">10<\/td><\/tr><\/tbody><\/table><\/div> Os custos unitários de matéria-prima são:<\/p><p>• Camisa = R$ 20,00;<\/p><p>• Camiseta = R$ 10,00. A partir da análise e observação das informações da empresa Roupas em Linho LTDA. assinale a opção que corresponde ao custo unitário para produzir Camisas e Camisetas, respectivamente, pelo método do Custeio ABC.<\/p><p class=\"option\">(A) Camisas R$ 125,69; Camisetas R$ 116,13.<\/p><p class=\"option\">(B) Camisas R$ 155,89; Camisetas R$ 149,68.<\/p><p class=\"option\">(C) Camisas R$ 129,22; Camisetas R$ 134,87.<\/p><p class=\"option\">(D) Camisas R$ 139,89; Camisetas R$ 139,65.<\/p>"}, {"n": 35, "kind": "answer", "part": 1, "parts": 3, "html": "<p><strong>Resposta: B — R$ 155,89 e R$ 149,68.<\/strong><\/p><p>No custeio ABC, cada atividade é atribuída aos produtos conforme o consumo de seu direcionador.<\/p><p><strong>Custo atribuído = Custo da atividade × Direcionador do produto ÷ Direcionador total.<\/strong><\/p>"}, {"n": 35, "kind": "answer", "part": 2, "parts": 3, "html": "<div class=\"table-scroll\"><table><thead><tr><th>Atividade<\/th><th>Camisas<\/th><th>Camisetas<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Atividade\">Comprar materiais<\/td><td data-label=\"Camisas\">20.000 × 200/300 = R$ 13.333,33<\/td><td data-label=\"Camisetas\">20.000 × 100/300 = R$ 6.666,67<\/td><\/tr><tr><td data-label=\"Atividade\">Desenvolver fornecedores<\/td><td data-label=\"Camisas\">12.000 × 4/10 = R$ 4.800,00<\/td><td data-label=\"Camisetas\">12.000 × 6/10 = R$ 7.200,00<\/td><\/tr><tr><td data-label=\"Atividade\">Cortar<\/td><td data-label=\"Camisas\">25.000 × 6/12 = R$ 12.500,00<\/td><td data-label=\"Camisetas\">25.000 × 6/12 = R$ 12.500,00<\/td><\/tr><tr><td data-label=\"Atividade\">Colar<\/td><td data-label=\"Camisas\">25.600 × 16/24 = R$ 17.066,67<\/td><td data-label=\"Camisetas\">25.600 × 8/24 = R$ 8.533,33<\/td><\/tr><tr><td data-label=\"Atividade\">Acabar<\/td><td data-label=\"Camisas\">18.000 × 4/14 = R$ 5.142,86<\/td><td data-label=\"Camisetas\">18.000 × 10/14 = R$ 12.857,14<\/td><\/tr><tr><td data-label=\"Atividade\">Despachar produtos<\/td><td data-label=\"Camisas\">30.200 × 5/10 = R$ 15.100,00<\/td><td data-label=\"Camisetas\">30.200 × 5/10 = R$ 15.100,00<\/td><\/tr><\/tbody><\/table><\/div>"}, {"n": 35, "kind": "answer", "part": 3, "parts": 3, "html": "<p>Mantendo a precisão nos cálculos e arredondando o total:<br>• custos das atividades das camisas: <strong>R$ 67.942,86<\/strong>;<br>• custos das atividades das camisetas: <strong>R$ 62.857,14<\/strong>.<\/p><p><strong>Camisas<\/strong><br>Custo das atividades por unidade:<br>R$ 67.942,86 ÷ 500 = R$ 135,89.<br>Somando a matéria-prima unitária:<br><strong>R$ 135,89 + R$ 20,00 = R$ 155,89.<\/strong><\/p><p><strong>Camisetas<\/strong><br>Custo das atividades por unidade:<br>R$ 62.857,14 ÷ 450 = R$ 139,68.<br>Somando a matéria-prima unitária:<br><strong>R$ 139,68 + R$ 10,00 = R$ 149,68.<\/strong><\/p>"}, {"n": 36, "kind": "question", "html": "<p>Uma indústria realizou os seguintes eventos durante determinado período:<\/p><p><div class=\"table-scroll\"><table><thead><tr><th>Evento<\/th><th>Valor (R$)<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Evento\">Compra de matéria-prima<\/td><td data-label=\"Valor (R$)\">18.000,00<\/td><\/tr><tr><td data-label=\"Evento\">Consumo de matéria-prima na produção<\/td><td data-label=\"Valor (R$)\">12.000,00<\/td><\/tr><tr><td data-label=\"Evento\">Aquisição de máquinas para a fábrica<\/td><td data-label=\"Valor (R$)\">40.000,00<\/td><\/tr><tr><td data-label=\"Evento\">Depreciação das máquinas utilizadas na produção<\/td><td data-label=\"Valor (R$)\">2.500,00<\/td><\/tr><tr><td data-label=\"Evento\">Salários das equipes jurídica e de marketing<\/td><td data-label=\"Valor (R$)\">6.000,00<\/td><\/tr><tr><td data-label=\"Evento\">Comissão sobre vendas (remuneração dos vendedores)<\/td><td data-label=\"Valor (R$)\">3.000,00<\/td><\/tr><\/tbody><\/table><\/div> Com base nos conceitos de custos, despesas e investimentos, o valor total dos custos incorridos no período foi de<\/p><p class=\"option\">(A) R$ 14.500,00.<\/p><p class=\"option\">(B) R$ 18.000,00.<\/p><p class=\"option\">(C) R$ 17.500,00.<\/p><p class=\"option\">(D) R$ 72.500,00.<\/p>"}, {"n": 36, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: A — R$ 14.500,00.<\/strong><\/p><p>São custos os recursos consumidos na produção:<\/p><div class=\"table-scroll\"><table><thead><tr><th>Evento<\/th><th>Classificação<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Evento\">Compra de matéria-prima<\/td><td data-label=\"Classificação\">Investimento em estoque<\/td><\/tr><tr><td data-label=\"Evento\">Consumo de matéria-prima na produção<\/td><td data-label=\"Classificação\">Custo: R$ 12.000,00<\/td><\/tr><tr><td data-label=\"Evento\">Aquisição de máquinas<\/td><td data-label=\"Classificação\">Investimento em imobilizado<\/td><\/tr><tr><td data-label=\"Evento\">Depreciação das máquinas de produção<\/td><td data-label=\"Classificação\">Custo: R$ 2.500,00<\/td><\/tr><tr><td data-label=\"Evento\">Salários das equipes jurídica e de marketing<\/td><td data-label=\"Classificação\">Despesa<\/td><\/tr><tr><td data-label=\"Evento\">Comissão sobre vendas<\/td><td data-label=\"Classificação\">Despesa<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Custos = R$ 12.000,00 + R$ 2.500,00 = R$ 14.500,00.<\/strong><\/p><p>A matéria-prima torna-se custo quando é consumida na produção. A compra, isoladamente, aumenta o estoque.<\/p>"}, {"n": 37, "kind": "question", "html": "<p>Uma loja vendia mochilas. Em 01/08/2026 não havia mochilas em estoque. Na data, a loja adquiriu 200 mochilas pelo total de R$ 16.000,00. O frete pago para o recebimento das mochilas foi de R$ 400,00. Em agosto de 2026, 180 mochilas foram vendidas, sendo que a receita da loja foi de R$ 36.000,00. A loja paga comissão a seus vendedores de 5% sobre o preço da mochila vendida. A margem de contribuição unitária da mochila foi de<\/p><p class=\"option\">(A) R$ 108,00.<\/p><p class=\"option\">(B) R$ 110,00.<\/p><p class=\"option\">(C) R$ 118,00.<\/p><p class=\"option\">(D) R$ 120,00.<\/p>"}, {"n": 37, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: A — R$ 108,00.<\/strong><\/p><p><strong>1. Preço de venda unitário<\/strong><br>R$ 36.000,00 ÷ 180 = <strong>R$ 200,00.<\/strong><\/p><p><strong>2. Custo unitário da mochila<\/strong><br>O frete de aquisição integra o custo:<br>(R$ 16.000,00 + R$ 400,00) ÷ 200 = <strong>R$ 82,00.<\/strong><\/p><p><strong>3. Comissão por unidade<\/strong><br>R$ 200,00 × 5% = <strong>R$ 10,00.<\/strong><\/p><p><strong>4. Margem de contribuição unitária<\/strong><br><strong>MC unitária = Preço de venda − Custo variável − Despesa variável.<\/strong><br>MC = R$ 200,00 − R$ 82,00 − R$ 10,00.<br><strong>MC unitária = R$ 108,00.<\/strong><\/p><p>Observe os divisores: o preço de venda usa as <strong>180 unidades vendidas<\/strong>; o custo de aquisição usa as <strong>200 unidades compradas<\/strong>.<\/p>"}, {"n": 38, "kind": "question", "html": "<p>Uma empresa está estudando quais quantidades deve produzir para chegar aos seus pontos de equilíbrio contábil, econômico e financeiro. Para isso, seu contador levantou as seguintes informações referentes ao mês de junho de 2026:<\/p><p>• Custos fixos: R$ 400.000,00;<\/p><p>• Despesas fixas: R$ 100.000,00;<\/p><p>• Custos variáveis: R$ 200,00/unidade;<\/p><p>• Despesas variáveis: R$ 50,00/unidade;<\/p><p>• Preço unitário de venda: R$ 750,00;<\/p><p>• Custo de oportunidade: R$ 500.000,00;<\/p><p>• Parcela não desembolsável dos custos: R$ 250.000,00. Com base nos dados levantados pelo contador, os pontos de equilíbrio contábil, econômico e financeiro dessa empresa são, respectivamente,<\/p><p class=\"option\">(A) 1.000 unidades, 1.800 unidades e 1.500 unidades.<\/p><p class=\"option\">(B) 1.000 unidades, 2.000 unidades e 500 unidades.<\/p><p class=\"option\">(C) 1.500 unidades, 1.800 unidades e 800 unidades.<\/p><p class=\"option\">(D) 1.500 unidades, 1.700 unidades e 300 unidades.<\/p>"}, {"n": 38, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: B — 1.000, 2.000 e 500 unidades.<\/strong><\/p><p>Primeiro, calculamos a margem de contribuição:<br><strong>MC unitária = R$ 750,00 − R$ 200,00 − R$ 50,00 = R$ 500,00.<\/strong><\/p><p>Custos e despesas fixos:<br>R$ 400.000,00 + R$ 100.000,00 = <strong>R$ 500.000,00.<\/strong><\/p><p><strong>Ponto de equilíbrio contábil<\/strong><br><strong>PEC = 500.000 ÷ 500 = 1.000 unidades.<\/strong><br>Nesse ponto, o resultado contábil é zero.<\/p><p><strong>Ponto de equilíbrio econômico<\/strong><br>Inclui o custo de oportunidade:<br><strong>PEE = (500.000 + 500.000) ÷ 500 = 2.000 unidades.<\/strong><br>Nesse ponto, a empresa também cobre a remuneração econômica esperada.<\/p>"}, {"n": 38, "kind": "answer", "part": 2, "parts": 2, "html": "<p><strong>Ponto de equilíbrio financeiro<\/strong><br>Exclui a parcela sem desembolso:<br><strong>PEF = (500.000 − 250.000) ÷ 500 = 500 unidades.<\/strong><br>Nesse ponto, a margem de contribuição cobre os gastos fixos desembolsáveis informados.<\/p>"}, {"n": 39, "kind": "question", "html": "<p>Um administrador deseja verificar qual é a relação entre a receita de vendas e o custo das mercadorias vendidas. Para a obtenção da informação, é recomendável que seja realizada a análise<\/p><p class=\"option\">(A) vertical do Balanço Patrimonial.<\/p><p class=\"option\">(B) horizontal do Balanço Patrimonial.<\/p><p class=\"option\">(C) vertical da Demonstração do Resultado.<\/p><p class=\"option\">(D) horizontal da Demonstração do Resultado.<\/p>"}, {"n": 39, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: C.<\/strong><\/p><p>A receita de vendas e o CMV são apresentados na <strong>Demonstração do Resultado<\/strong>.<\/p><p>A análise <strong>vertical<\/strong> mostra a participação de uma conta em relação a uma base da mesma demonstração e do mesmo período.<\/p><p>Por exemplo:<br><strong>Participação do CMV = CMV ÷ Receita de vendas × 100.<\/strong><\/p><p>Se a receita for R$ 100.000,00 e o CMV R$ 60.000,00, o CMV representa <strong>60% da receita<\/strong>.<\/p><p>A análise horizontal avalia a evolução dos valores entre períodos.<\/p>"}, {"n": 40, "kind": "question", "html": "<p>Uma empresa, buscando captar um empréstimo junto a uma instituição financeira, apurou seus indicadores de liquidez para verificar sua capacidade de pagamento. O contador apurou o seguinte balanço patrimonial dos 2 últimos anos:<\/p><p><div class=\"table-scroll\"><table><thead><tr><th>ATIVO<\/th><th>31/12/24<\/th><th>31/12/25<\/th><\/tr><\/thead><tbody><tr><td data-label=\"ATIVO\">Disponível<\/td><td data-label=\"31/12/24\">R$ 300.000,00<\/td><td data-label=\"31/12/25\">R$ 400.000,00<\/td><\/tr><tr><td data-label=\"ATIVO\">Contas a Receber no Curto Prazo<\/td><td data-label=\"31/12/24\">R$ 500.000,00<\/td><td data-label=\"31/12/25\">R$ 600.000,00<\/td><\/tr><tr><td data-label=\"ATIVO\">Estoques<\/td><td data-label=\"31/12/24\">R$ 500.000,00<\/td><td data-label=\"31/12/25\">R$ 800.000,00<\/td><\/tr><tr><td data-label=\"ATIVO\">Realizável a Longo Prazo<\/td><td data-label=\"31/12/24\">R$ 700.000,00<\/td><td data-label=\"31/12/25\">R$ 1.200.000,00<\/td><\/tr><tr><td data-label=\"ATIVO\">TOTAL<\/td><td data-label=\"31/12/24\">R$ 2.000.000,00<\/td><td data-label=\"31/12/25\">R$ 3.000.000,00<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-scroll\"><table><thead><tr><th>PASSIVO + PL<\/th><th>31/12/24<\/th><th>31/12/25<\/th><\/tr><\/thead><tbody><tr><td data-label=\"PASSIVO + PL\">Fornecedores<\/td><td data-label=\"31/12/24\">R$ 400.000,00<\/td><td data-label=\"31/12/25\">R$ 1.100.000,00<\/td><\/tr><tr><td data-label=\"PASSIVO + PL\">Empréstimos de Curto Prazo<\/td><td data-label=\"31/12/24\">R$ 100.000,00<\/td><td data-label=\"31/12/25\">R$ 500.000,00<\/td><\/tr><tr><td data-label=\"PASSIVO + PL\">Empréstimos de Longo Prazo<\/td><td data-label=\"31/12/24\">R$ 500.000,00<\/td><td data-label=\"31/12/25\">R$ 400.000,00<\/td><\/tr><tr><td data-label=\"PASSIVO + PL\">Patrimônio Líquido<\/td><td data-label=\"31/12/24\">R$ 1.000.000,00<\/td><td data-label=\"31/12/25\">R$ 1.000.000,00<\/td><\/tr><tr><td data-label=\"PASSIVO + PL\">TOTAL<\/td><td data-label=\"31/12/24\">R$ 2.000.000,00<\/td><td data-label=\"31/12/25\">R$ 3.000.000,00<\/td><\/tr><\/tbody><\/table><\/div> Com base nesses dados, os indicadores de liquidez geral da empresa nos anos de 2024 e 2025 foram, respectivamente,<\/p><p class=\"option\">(A) 1,0 e 1,0.<\/p><p class=\"option\">(B) 1,6 e 0,6.<\/p><p class=\"option\">(C) 2,6 e 1,1.<\/p><p class=\"option\">(D) 2,0 e 1,5.<\/p>"}, {"n": 40, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: D — 2,0 e 1,5.<\/strong><\/p><p>Fórmula:<br><strong>LG = (Ativo Circulante + Realizável a Longo Prazo) ÷ (Passivo Circulante + Passivo Não Circulante).<\/strong><\/p><p><strong>2024 — Numerador<\/strong><br>R$ 300.000 + R$ 500.000 + R$ 500.000 + R$ 700.000 = <strong>R$ 2.000.000.<\/strong><\/p><p><strong>2024 — Denominador<\/strong><br>R$ 400.000 + R$ 100.000 + R$ 500.000 = <strong>R$ 1.000.000.<\/strong><\/p><p><strong>LG de 2024 = 2.000.000 ÷ 1.000.000 = 2,0.<\/strong><\/p><p><strong>2025 — Numerador<\/strong><br>R$ 400.000 + R$ 600.000 + R$ 800.000 + R$ 1.200.000 = <strong>R$ 3.000.000.<\/strong><\/p><p><strong>2025 — Denominador<\/strong><br>R$ 1.100.000 + R$ 500.000 + R$ 400.000 = <strong>R$ 2.000.000.<\/strong><\/p><p><strong>LG de 2025 = 3.000.000 ÷ 2.000.000 = 1,5.<\/strong><\/p>"}, {"n": 40, "kind": "answer", "part": 2, "parts": 2, "html": "<p><strong>O patrimônio líquido não integra o denominador<\/strong>, pois não representa dívida com terceiros.<\/p>"}, {"n": 41, "kind": "question", "html": "<p>O Município ABC está desenvolvendo um projeto para reconhecimento dos bens do patrimônio cultural no Balanço Patrimonial. Nas reuniões para mensuração e evidenciação dos referidos ativos, foram mapeadas dificuldades em potencial na representação contábil do fenômeno de forma completa, neutra e livre de erro material. Com base na NBC TSP – ESTRUTURA CONCEITUAL, o reconhecimento dos bens do patrimônio cultural, nessas condições, descumpre a seguinte característica qualitativa da informação contábil:<\/p><p class=\"option\">(A) relevância.<\/p><p class=\"option\">(B) representação fidedigna.<\/p><p class=\"option\">(C) compreensibilidade.<\/p><p class=\"option\">(D) verificabilidade.<\/p>"}, {"n": 41, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: B — representação fidedigna.<\/strong><\/p><p>As expressões decisivas são:<br><strong>Completa + neutra + livre de erro material.<\/strong><br>Elas caracterizam a <strong>representação fidedigna<\/strong>.<\/p><p><strong>Completa:<\/strong> inclui as informações necessárias à compreensão do fenômeno.<\/p><p><strong>Neutra:<\/strong> não apresenta viés para favorecer determinado resultado.<\/p><p><strong>Livre de erro material:<\/strong> não contém erros ou omissões materiais na representação.<\/p><p>As demais características se referem a:<\/p>"}, {"n": 41, "kind": "answer", "part": 2, "parts": 2, "html": "<div class=\"table-scroll\"><table><thead><tr><th>Característica<\/th><th>Ideia principal<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Característica\">Relevância<\/td><td data-label=\"Ideia principal\">Capacidade de influenciar avaliações e decisões<\/td><\/tr><tr><td data-label=\"Característica\">Compreensibilidade<\/td><td data-label=\"Ideia principal\">Clareza na apresentação das informações<\/td><\/tr><tr><td data-label=\"Característica\">Verificabilidade<\/td><td data-label=\"Ideia principal\">Possibilidade de observadores independentes chegarem a consenso sobre a representação<\/td><\/tr><\/tbody><\/table><\/div><p>Base: NBC TSP — Estrutura Conceitual.<\/p>"}, {"n": 42, "kind": "question", "html": "<p>Os Princípios Orçamentários visam estabelecer diretrizes norteadoras básicas, a fim de conferir racionalidade, eficiência e transparência para os processos de elaboração, execução e controle do orçamento público. Com base nos princípios orçamentários aplicáveis ao setor público brasileiro, conforme apresentados no Manual de Contabilidade Aplicada ao Setor Público (MCASP), analise os casos a seguir:<\/p><p>• Caso 1: Um município elaborou dois documentos orçamentários para o mesmo exercício: uma Lei Orçamentária Anual para a administração direta e outro documento orçamentário separado para as autarquias municipais.<\/p><p>• Caso 2: A Lei Orçamentária Anual de um município foi elaborada para vigorar por dois anos consecutivos, prevendo receitas e despesas para o período de 2025 a 2026.<\/p><p>• Caso 3: Na elaboração da Lei Orçamentária Anual de determinado estado, as receitas e despesas de uma fundação pública estadual não foram incluídas na Lei Orçamentária Anual, sendo registradas apenas em relatórios internos da própria entidade. Os casos 1, 2 e 3 estão infringindo os seguintes princípios orçamentários, respectivamente:<\/p><p class=\"option\">(A) exclusividade; legalidade; e unidade ou totalidade.<\/p><p class=\"option\">(B) universalidade; unidade ou totalidade; e exclusividade.<\/p><p class=\"option\">(C) unidade ou totalidade; anualidade ou periodicidade; e universalidade.<\/p><p class=\"option\">(D) legalidade; orçamento bruto; e unidade ou totalidade.<\/p>"}, {"n": 42, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: C.<\/strong><\/p><div class=\"table-scroll\"><table><thead><tr><th>Caso<\/th><th>Princípio violado<\/th><th>Explicação<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Caso\">1<\/td><td data-label=\"Princípio violado\">Unidade ou totalidade<\/td><td data-label=\"Explicação\">O orçamento deve integrar as receitas e despesas do ente em uma estrutura orçamentária unificada<\/td><\/tr><tr><td data-label=\"Caso\">2<\/td><td data-label=\"Princípio violado\">Anualidade ou periodicidade<\/td><td data-label=\"Explicação\">A LOA corresponde a um exercício financeiro<\/td><\/tr><tr><td data-label=\"Caso\">3<\/td><td data-label=\"Princípio violado\">Universalidade<\/td><td data-label=\"Explicação\">Todas as receitas e despesas abrangidas devem constar do orçamento<\/td><\/tr><\/tbody><\/table><\/div><p>A Lei nº 4.320/1964 estabelece esses princípios no art. 2º.<\/p><p><strong>Para memorizar<\/strong><br><strong>Unidade: um orçamento integrado.<\/strong><br><strong>Anualidade: um exercício financeiro.<\/strong><br><strong>Universalidade: todas as receitas e despesas.<\/strong><\/p>"}, {"n": 43, "kind": "question", "html": "<p>Em junho de 2026, um posto de saúde aplicou 3.000 doses de vacina. Em julho, o posto foi acionado na Justiça por um grupo de pessoas que tiveram fortes reações atribuídas às vacinas e pediam uma indenização. A Procuradoria Jurídica da Secretaria de Saúde à qual o posto de saúde encontra-se vinculado emitiu parecer que considerou que a probabilidade da saída de recursos, em decorrência da causa judicial era remota, de modo que não houve reconhecimento em contas patrimoniais. Nesse caso, a divulgação em notas explicativas é<\/p><p class=\"option\">(A) proibida.<\/p><p class=\"option\">(B) dispensada.<\/p><p class=\"option\">(C) incentivada.<\/p><p class=\"option\">(D) obrigatória.<\/p>"}, {"n": 43, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: B — dispensada.<\/strong><\/p><p>Quando a probabilidade de saída de recursos é <strong>remota<\/strong>, não se reconhece provisão e a divulgação do passivo contingente é dispensada.<\/p><div class=\"table-scroll\"><table><thead><tr><th>Probabilidade de saída de recursos<\/th><th>Tratamento<\/th><\/tr><\/thead><tbody><tr><td data-label=\"Probabilidade de saída de recursos\">Provável, com obrigação presente e estimativa confiável<\/td><td data-label=\"Tratamento\">Reconhece provisão e divulga<\/td><\/tr><tr><td data-label=\"Probabilidade de saída de recursos\">Possível<\/td><td data-label=\"Tratamento\">Não reconhece provisão; divulga passivo contingente<\/td><\/tr><tr><td data-label=\"Probabilidade de saída de recursos\">Remota<\/td><td data-label=\"Tratamento\">Não reconhece provisão; divulgação dispensada<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Dispensada não significa proibida.<\/strong> A alternativa A confunde a ausência de obrigação de divulgar com uma vedação.<br>Base: NBC TSP 03.<\/p>"}, {"n": 44, "kind": "question", "html": "<p>Ao encerrar o exercício financeiro, a equipe contábil de um município analisava os procedimentos de execução da despesa orçamentária. Em reunião, surgiram dúvidas acerca dos efeitos do empenho, das características da liquidação e dos requisitos para a realização do pagamento pela Administração Pública. Considerando esse contexto, analise as afirmativas a seguir.<\/p><p>I. O empenho da despesa cria para o Estado a obrigação de pagamento, pendente ou não de implemento de condição.<\/p><p>II. A liquidação da despesa consiste na verificação do direito adquirido pelo credor, com base nos títulos e documentos comprobatórios do respectivo crédito.<\/p><p>III. O pagamento da despesa pode ocorrer independentemente da liquidação prévia, desde que haja previsão contratual ou mera conveniência administrativa para a antecipação do desembolso.<\/p><p>IV. A etapa da execução da despesa orçamentária percorre, em regra, os estágios de empenho, liquidação e pagamento. Estão corretas as afirmativas<\/p><p class=\"option\">(A) I e II, apenas.<\/p><p class=\"option\">(B) I, II e IV, apenas.<\/p><p class=\"option\">(C) II, III e IV, apenas.<\/p><p class=\"option\">(D) I, III e IV, apenas.<\/p>"}, {"n": 44, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: B — I, II e IV.<\/strong><\/p><p><strong>I — Correta.<\/strong> Reproduz a definição de empenho do art. 58 da Lei nº 4.320/1964.<\/p><p><strong>II — Correta.<\/strong> Corresponde à definição de liquidação do art. 63.<\/p><p><strong>III — Incorreta.<\/strong> O art. 62 determina que o pagamento somente seja efetuado quando ordenado após a regular liquidação. A mera conveniência administrativa ou uma previsão contratual não afasta essa exigência.<\/p><p><strong>IV — Correta.<\/strong> Os estágios da execução são, em regra, <strong>empenho, liquidação e pagamento<\/strong>.<\/p>"}, {"n": 44, "kind": "answer", "part": 2, "parts": 2, "html": "<p><strong>Em termos didáticos<\/strong><br>• <strong>Empenho:<\/strong> compromete a dotação orçamentária.<br>• <strong>Liquidação:<\/strong> verifica o direito do credor, o objeto e o valor devido.<br>• <strong>Pagamento:<\/strong> realiza a quitação.<\/p>"}, {"n": 45, "kind": "question", "html": "<p>Uma entidade deseja elaborar o seu orçamento de 2026, começando pela projeção da receita bruta de vendas. As seguintes informações foram estimadas para 2026:<\/p><p>I. Projeção do número de unidades vendidas.<\/p><p>II. Projeção do preço a ser praticado.<\/p><p>III. Projeção do aluguel das lojas. Para estimar o valor da receita bruta de vendas, a entidade deve levar em consideração o que se apresenta em:<\/p><p class=\"option\">(A) I, somente.<\/p><p class=\"option\">(B) I e II, somente.<\/p><p class=\"option\">(C) I e III, somente.<\/p><p class=\"option\">(D) II e III, somente.<\/p>"}, {"n": 45, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: B — I e II.<\/strong><\/p><p>A receita bruta projetada depende de:<br><strong>Receita bruta = Quantidade prevista de vendas × Preço previsto de venda.<\/strong><\/p><p>Por exemplo:<br>1.000 unidades × R$ 100,00 = R$ 100.000,00 de receita bruta.<\/p><p>O aluguel das lojas é uma despesa e não participa diretamente desse cálculo.<\/p>"}, {"n": 46, "kind": "question", "html": "<p>Uma determinada empresa, do ramo de varejo, contratou uma firma de auditoria, para verificar as demonstrações contábeis do ano anterior. O presidente da empresa de ramo de varejo esperava que a asseguração de uma auditoria trouxesse credibilidade para sua empresa no ramo, por trazer um maior grau de confiança às demonstrações contábeis. Considerando os dizeres da NBC TA 200 (R1) – OBJETIVOS GERAIS DO AUDITOR INDEPENDENTE E A CONDUÇÃO DA AUDITORIA EM CONFORMIDADE COM NORMAS DE AUDITORIA, é correto afirmar que o presidente da empresa do ramo de varejo estava<\/p><p class=\"option\">(A) errado, pois a auditoria independente tem como objetivo assegurar a continuidade e a viabilidade do negócio analisado.<\/p><p class=\"option\">(B) certo, porque a auditoria visa, principalmente, à verificação de fraudes e erros.<\/p><p class=\"option\">(C) certo, pois o objetivo da auditoria é obter segurança razoável de que as demonstrações contábeis como um todo estão livres de distorção relevante.<\/p><p class=\"option\">(D) errado, pois cabe à auditoria externa auxiliar a Administração na elaboração das demonstrações contábeis.<\/p>"}, {"n": 46, "kind": "answer", "part": 1, "parts": 2, "html": "<p><strong>Resposta: C.<\/strong><\/p><p>A auditoria aumenta a confiança dos usuários mediante a emissão de uma opinião sobre as demonstrações contábeis.<\/p><p>Para fundamentar essa opinião, o auditor busca <strong>segurança razoável<\/strong> de que as demonstrações, como um todo, estão livres de distorção relevante, causada por fraude ou erro.<\/p><p><strong>A:<\/strong> a auditoria não garante a continuidade nem a viabilidade do negócio.<\/p><p><strong>B:<\/strong> a detecção de fraudes e erros relevantes integra o trabalho, mas essa alternativa reduz indevidamente o objetivo da auditoria.<\/p><p><strong>D:<\/strong> a elaboração das demonstrações é responsabilidade da administração.<\/p>"}, {"n": 46, "kind": "answer", "part": 2, "parts": 2, "html": "<p><strong>Segurança razoável é um nível elevado de segurança, mas não uma garantia absoluta.<\/strong><br>Base: NBC TA 200.<\/p>"}, {"n": 47, "kind": "question", "html": "<p>De acordo com a NBC TA 705 – MODIFICAÇÕES NA OPINIÃO DO AUDITOR INDEPENDENTE, quando o auditor prevê modificar a opinião no seu relatório, ele deve comunicar aos responsáveis pela governança as circunstâncias que levaram à modificação prevista e o texto proposto da modificação. Isso permite que os responsáveis pela governança, quando apropriado, tenham a oportunidade de<\/p><p class=\"option\">(A) aumentar os honorários previstos inicialmente.<\/p><p class=\"option\">(B) comunicar, previamente, o fato às entidades reguladoras.<\/p><p class=\"option\">(C) fornecer ao auditor informações e explicações adicionais sobre os assuntos que deram origem às modificações previstas.<\/p><p class=\"option\">(D) contratar outra firma de auditoria para fornecer um relatório com informações e explicações que deram origem às modificações previstas.<\/p>"}, {"n": 47, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: C.<\/strong><\/p><p>A comunicação permite que os responsáveis pela governança compreendam o problema e apresentem informações e explicações adicionais.<\/p><p>Esses esclarecimentos podem contribuir para a avaliação do auditor sobre os assuntos que motivaram a modificação.<\/p><p>A comunicação não tem como finalidade aumentar honorários nem substituir a firma de auditoria. A opinião continua sendo uma conclusão independente do auditor.<br>Base: NBC TA 705.<\/p>"}, {"n": 48, "kind": "question", "html": "<p>Durante a auditoria das demonstrações contábeis da Companhia Beta S.A., referentes ao exercício findo em 31 de dezembro de 2025, o auditor identificou que a entidade apresentou prejuízo de R$ 30 milhões no exercício e que o passivo circulante excedia o ativo circulante em R$ 35 milhões nas demonstrações contábeis individuais e em R$ 32 milhões nas demonstrações contábeis consolidadas. Essas condições estão adequadamente divulgadas na nota explicativa nº 3, na qual a administração também descreve as ações que está implementando para restabelecer o equilíbrio econômico-financeiro da companhia. O auditor concluiu que tais eventos indicam a existência de incerteza relevante que pode levantar dúvida significativa quanto à capacidade de continuidade operacional, mas verificou que a divulgação nas demonstrações contábeis é apropriada, adequada e suficiente. Nessas circunstâncias, o relatório do auditor independente deve conter<\/p><p class=\"option\">(A) opinião com ressalva, em razão da deterioração da posição financeira da companhia.<\/p><p class=\"option\">(B) opinião adversa, em razão do prejuízo relevante apresentado no exercício.<\/p><p class=\"option\">(C) abstenção de opinião, em razão da incerteza quanto à continuidade operacional.<\/p><p class=\"option\">(D) parágrafo de ênfase, chamando a atenção para a nota explicativa que descreve a incerteza relacionada à continuidade operacional.<\/p>"}, {"n": 48, "kind": "answer", "part": 1, "parts": 3, "html": "<p><strong>SUBJUDICE<\/strong><\/p><p><strong>Resposta tecnicamente correta: nenhuma alternativa descreve integralmente o tratamento exigido. A alternativa D parece ser a pretendida pelo elaborador.<\/strong><\/p><p>O enunciado informa que existe <strong>incerteza relevante relacionada à continuidade operacional<\/strong>, com divulgação adequada.<\/p><p>Para a situação descrita, admitindo que o uso da base de continuidade seja apropriado, o item 22 da NBC TA 570 determina:<br>• <strong>opinião não modificada<\/strong>;<br>• uma <strong>seção separada<\/strong> intitulada <strong>“Incerteza relevante relacionada com a continuidade operacional”<\/strong>;<br>• referência à nota explicativa que apresenta a incerteza.<\/p>"}, {"n": 48, "kind": "answer", "part": 2, "parts": 3, "html": "<p>Essa seção específica <strong>não é um parágrafo de ênfase<\/strong>. Portanto, a redação da alternativa D apresenta uma impropriedade técnica.<\/p><p>As demais alternativas também não se justificam pelos fatos apresentados:<\/p><p><strong>A:<\/strong> dificuldades financeiras, isoladamente, não exigem ressalva.<\/p><p><strong>B:<\/strong> prejuízo, isoladamente, não determina opinião adversa.<\/p><p><strong>C:<\/strong> a incerteza descrita, com divulgação adequada, não determina automaticamente abstenção.<\/p><p><strong>Para estudar a norma: opinião não modificada + seção específica sobre a incerteza relevante.<\/strong><\/p>"}, {"n": 48, "kind": "answer", "part": 3, "parts": 3, "html": "<p><strong>Para a questão: D é a provável intenção, mas há fundamento técnico para contestação.<\/strong> Essa conclusão é da análise normativa; não estou afirmando que houve anulação oficial.<\/p><p>A identificação <strong>SUBJUDICE<\/strong> foi incluída conforme solicitado pelo Professor Moreira; ela não confirma, por si só, a existência de decisão judicial.<\/p>"}, {"n": 49, "kind": "question", "html": "<p>No âmbito de uma perícia judicial, o perito contábil nomeado, Dr. Y, concluiu os trabalhos e protocolou o laudo. O assistente técnico indicado pela parte autora, contador X, discordou dos critérios de avaliação patrimonial adotados e pretende elaborar seu parecer técnico contábil. Ocorre que a avaliação dos ativos imóveis foi realizada exclusivamente por engenheiro de avaliações, profissional de outra área, sem participação técnica de Dr. Y. O assistente X cogita subscrever o laudo do engenheiro como forma de validá-lo, para ampliar a força probatória da perícia. Considerando a NBC TP 01 (R2) – PERÍCIA CONTÁBIL, a conduta de X, ao subscrever o laudo do engenheiro, seria<\/p><p class=\"option\">(A) lícita, desde que X declare expressamente que se responsabiliza apenas pela parte contábil do documento.<\/p><p class=\"option\">(B) lícita, pois o assistente técnico pode validar laudo de especialista de outra área quando o objeto da perícia for multidisciplinar.<\/p><p class=\"option\">(C) vedada, pois é defeso ao assistente técnico validar, ratificar ou subscrever laudo elaborado por profissional de outra área; X deve oferecer seu próprio parecer técnico contábil.<\/p><p class=\"option\">(D) vedada apenas se o laudo do engenheiro não tiver sido homologado pelo juízo, sendo lícita após a homologação.<\/p>"}, {"n": 49, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: C.<\/strong><\/p><p>A norma veda ao assistente técnico validar, ratificar ou subscrever laudo pericial elaborado por leigo ou profissional de outra área. Ele deve apresentar seu <strong>parecer técnico contábil<\/strong> sobre a matéria periciada.<\/p><p>“Defeso” significa <strong>proibido ou vedado<\/strong>.<\/p><p>Assim, X deve elaborar seu próprio parecer, expondo os critérios, análises e conclusões contábeis que fundamentam sua discordância.<\/p><p><strong>A:<\/strong> a declaração de responsabilidade limitada não afasta a vedação.<\/p><p><strong>B:<\/strong> o caráter multidisciplinar não autoriza a conduta descrita.<\/p><p><strong>D:<\/strong> a homologação judicial não elimina a vedação profissional.<br>Base: NBC TP 01 (R2), item 38.<\/p>"}, {"n": 50, "kind": "question", "html": "<p>A perita contábil Dra. W foi contratada para realizar perícia extrajudicial voluntária, visando apurar haveres em dissolução parcial de sociedade empresária. Ao elaborar o laudo pericial contábil, W estruturou o documento com os seguintes elementos: identificação das partes; síntese do caso; síntese do objeto e do objetivo da perícia; relato das diligências; transcrição dos quesitos e respostas; e assinatura com número de CRC. Após análise técnica, a parte contrária apontou que o laudo carecia de elemento obrigatório previsto na NBC TP 01 (R2) – PERÍCIA CONTÁBIL. Nesse caso, o seguinte elemento obrigatório da estrutura mínima do laudo pericial contábil foi omitido por Dra. W:<\/p><p class=\"option\">(A) o cronograma das diligências realizadas durante a execução da perícia.<\/p><p class=\"option\">(B) a fundamentação, contemplando o método científico adotado e a análise técnica e/ou científica realizada.<\/p><p class=\"option\">(C) a ata das reuniões técnicas realizadas com os assistentes técnicos das partes.<\/p><p class=\"option\">(D) o contrato de prestação de serviços firmado entre a perita e o contratante.<\/p>"}, {"n": 50, "kind": "answer", "part": 1, "parts": 1, "html": "<p><strong>Resposta: B.<\/strong><\/p><p>O laudo deve apresentar a <strong>fundamentação<\/strong> que sustenta o trabalho e suas conclusões.<\/p><p>Ela contempla o método científico adotado e a análise técnica e/ou científica realizada.<\/p><p>Não basta relatar diligências e responder aos quesitos. É necessário demonstrar <strong>como a perita chegou às respostas<\/strong>, com os critérios e procedimentos empregados.<\/p><p>Entre as alternativas, cronograma, atas de reuniões e contrato de prestação de serviços não substituem esse elemento obrigatório.<br>Base: NBC TP 01 (R2).<\/p>"}], FIRST={"1": 0, "2": 2, "3": 4, "4": 7, "5": 9, "6": 12, "7": 14, "8": 16, "9": 19, "10": 22, "11": 25, "12": 27, "13": 29, "14": 31, "15": 33, "16": 35, "17": 37, "18": 39, "19": 41, "20": 43, "21": 46, "22": 48, "23": 50, "24": 52, "25": 54, "26": 56, "27": 59, "28": 61, "29": 63, "30": 66, "31": 68, "32": 71, "33": 74, "34": 78, "35": 81, "36": 85, "37": 87, "38": 89, "39": 92, "40": 94, "41": 97, "42": 100, "43": 102, "44": 104, "45": 107, "46": 109, "47": 112, "48": 114, "49": 118, "50": 120}, ANSWER={"1": 1, "2": 3, "3": 5, "4": 8, "5": 10, "6": 13, "7": 15, "8": 17, "9": 20, "10": 23, "11": 26, "12": 28, "13": 30, "14": 32, "15": 34, "16": 36, "17": 38, "18": 40, "19": 42, "20": 44, "21": 47, "22": 49, "23": 51, "24": 53, "25": 55, "26": 57, "27": 60, "28": 62, "29": 64, "30": 67, "31": 69, "32": 72, "33": 75, "34": 79, "35": 82, "36": 86, "37": 88, "38": 90, "39": 93, "40": 95, "41": 98, "42": 101, "43": 103, "44": 105, "45": 108, "46": 110, "47": 113, "48": 115, "49": 119, "50": 121};

let scrollTimer;window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{if(state.name){state.scroll=window.scrollY;save()}},200)});window.addEventListener('pagehide',()=>{if(state.name){state.scroll=window.scrollY;save()}});render();const resumeScroll=state.scroll;requestAnimationFrame(()=>window.scrollTo(0,resumeScroll));
</script></body></html>
